<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VoicePro — Sound Board</title>
<style>
  :root {
    --bg: #0a0c10;
    --panel: #141820;
    --panel-inner: #1a1f2b;
    --border: #252d3a;
    --border-light: #333d4e;
    --accent: #f0a500;
    --accent-dim: rgba(240,165,0,.15);
    --green-led: #39ff14;
    --red-led: #ff2020;
    --yellow-led: #ffcc00;
    --text: #d0d8e8;
    --text-dim: #5a6577;
    --text-bright: #f0f4fa;
    --radius: 4px;
    --pad-size: min(110px, 18vw);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* ══════════════════════════════════════
     TOP BAR — Timer + Master Section
  ══════════════════════════════════════ */
  .top-bar {
    background: var(--panel);
    border-bottom: 2px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,.5);
  }
  .logo {
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    white-space: nowrap;
    text-shadow: 0 0 12px rgba(240,165,0,.4);
  }
  .logo span { color: var(--text-dim); font-weight: 400; letter-spacing: 1px; font-size: .7rem; display: block; }

  /* ── Timer ── */
  .timer-section {
    background: #080a0e;
    border: 1px solid var(--border-light);
    border-radius: var(--radius);
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 200px;
    max-width: 380px;
  }
  .timer-label {
    font-size: .6rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-dim);
    writing-mode: horizontal-tb;
  }
  .timer-display {
    font-family: 'Courier New', monospace;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--green-led);
    text-shadow: 0 0 10px rgba(57,255,20,.5);
    letter-spacing: 2px;
    min-width: 100px;
    text-align: center;
  }
  .timer-display.countdown { color: var(--yellow-led); text-shadow: 0 0 10px rgba(255,204,0,.5); }
  .timer-display.over { color: var(--red-led); text-shadow: 0 0 10px rgba(255,32,32,.5); animation: blink .5s infinite; }
  @keyframes blink { 50% { opacity: .4; } }
  .timer-btns { display: flex; gap: 4px; }
  .t-btn {
    background: var(--panel-inner);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 8px;
    border-radius: 3px;
    cursor: pointer;
    font-size: .7rem;
    font-weight: 600;
    transition: all .1s;
  }
  .t-btn:hover { color: var(--text); border-color: var(--border-light); }
  .t-btn.run { color: var(--green-led); border-color: rgba(57,255,20,.3); }
  .t-btn.run:hover { background: rgba(57,255,20,.1); }
  .t-btn.stop { color: var(--yellow-led); border-color: rgba(255,204,0,.3); }
  .t-btn.reset { color: var(--text-dim); }

  /* Timer input row */
  .timer-input-row {
    display: none;
    align-items: center;
    gap: 6px;
    width: 100%;
    padding-top: 6px;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }
  .timer-input-row.show { display: flex; }
  .timer-input-row label { font-size: .65rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .timer-input-row input[type=number] {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--yellow-led);
    font-family: 'Courier New', monospace;
    font-size: .9rem;
    padding: 3px 6px;
    border-radius: 3px;
    width: 50px;
    text-align: center;
    outline: none;
  }
  .timer-input-row span { font-size: .7rem; color: var(--text-dim); }

  /* ── Master Fader Section ── */
  .master-section {
    background: var(--panel-inner);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .master-label {
    font-size: .55rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-dim);
    writing-mode: vertical-rl;
    transform: rotate(180deg);
  }
  .master-fader-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .master-fader {
    writing-mode: vertical-lr;
    direction: rtl;
    width: 120px;
    accent-color: var(--accent);
    height: 8px;
  }
  .master-val {
    font-family: 'Courier New', monospace;
    font-size: .8rem;
    color: var(--accent);
  }
  .master-mute {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 3px 8px;
    border-radius: 3px;
    cursor: pointer;
    font-size: .65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .master-mute.muted { color: var(--red-led); border-color: rgba(255,32,32,.4); background: rgba(255,32,32,.1); }

  /* ── Tool strip ── */
  .tools {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-left: auto;
  }
  .tool-btn {
    background: var(--panel-inner);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: .75rem;
    transition: all .12s;
    white-space: nowrap;
  }
  .tool-btn:hover { color: var(--text); border-color: var(--border-light); background: var(--border); }
  .tool-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }
  .tool-btn.add { border-color: rgba(57,255,20,.3); color: var(--green-led); }
  .tool-btn.add:hover { background: rgba(57,255,20,.1); }

  /* ══════════════════════════════════════
     CHANNEL STRIPS
  ══════════════════════════════════════ */
  main {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .channel-stripes {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .channel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    width: var(--pad-size);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 8px 8px;
    position: relative;
    transition: border-color .12s, box-shadow .12s;
    user-select: none;
    -webkit-user-select: none;
  }
  .channel:hover { border-color: var(--border-light); }
  .channel.playing {
    border-color: var(--green-led);
    box-shadow: 0 0 15px rgba(57,255,20,.2), inset 0 0 15px rgba(57,255,20,.05);
  }
  .channel.muted-ch { opacity: .4; }

  /* LED indicator */
  .led {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border-light);
    margin-bottom: 6px;
    transition: all .1s;
    flex-shrink: 0;
  }
  .channel.playing .led {
    background: var(--green-led);
    box-shadow: 0 0 6px var(--green-led);
  }
  .channel.muted-ch .led { background: var(--red-led); box-shadow: 0 0 6px var(--red-led); }

  /* Pad button */
  .pad-btn {
    width: 100%;
    aspect-ratio: 1;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    background: linear-gradient(145deg, var(--panel-inner), #0e1117);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    transition: all .08s;
    position: relative;
    overflow: hidden;
  }
  .pad-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.03), transparent 70%);
    pointer-events: none;
  }
  .pad-btn:active, .channel.playing .pad-btn {
    background: linear-gradient(145deg, #1e2a1a, #0e1117);
    border-color: var(--green-led);
    transform: scale(.96);
    box-shadow: inset 0 0 20px rgba(57,255,20,.1);
  }
  .pad-btn .pad-icon { font-size: clamp(1.4rem, 4vw, 2rem); line-height: 1; }
  .pad-btn .pad-name {
    font-size: clamp(.5rem, 1.5vw, .7rem);
    font-weight: 600;
    color: var(--text);
    text-align: center;
    line-height: 1.2;
    padding: 0 2px;
    word-break: break-word;
    max-height: 2.4em;
    overflow: hidden;
  }
  .pad-btn .pad-cue {
    position: absolute;
    top: 3px;
    right: 4px;
    font-size: .5rem;
    font-family: 'Courier New', monospace;
    color: var(--text-dim);
    background: var(--bg);
    padding: 1px 3px;
    border-radius: 2px;
  }

  /* Mini fader per channel */
  .ch-fader-row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 6px;
  }
  .ch-fader {
    flex: 1;
    height: 4px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .ch-vol-label {
    font-size: .5rem;
    color: var(--text-dim);
    font-family: monospace;
    min-width: 24px;
    text-align: right;
  }

  /* Mute / Solo buttons */
  .ch-controls {
    display: flex;
    gap: 4px;
    margin-top: 5px;
    width: 100%;
  }
  .ch-btn {
    flex: 1;
    padding: 3px 0;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--panel-inner);
    color: var(--text-dim);
    font-size: .55rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all .1s;
    text-align: center;
  }
  .ch-btn.mute-btn.active {
    color: var(--red-led);
    border-color: rgba(255,32,32,.4);
    background: rgba(255,32,32,.1);
  }
  .ch-btn.solo-btn.active {
    color: var(--yellow-led);
    border-color: rgba(255,204,0,.4);
    background: rgba(255,204,0,.1);
  }

  /* Delete btn */
  .ch-delete {
    position: absolute;
    top: 4px;
    left: 4px;
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: .65rem;
    opacity: 0;
    transition: opacity .1s;
    line-height: 1;
    padding: 2px;
  }
  .channel:hover .ch-delete { opacity: 1; }
  .ch-delete:hover { color: var(--red-led); }

  /* Edit btn */
  .ch-edit {
    position: absolute;
    top: 4px;
    right: 4px;
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: .6rem;
    opacity: 0;
    transition: opacity .1s;
    padding: 2px;
  }
  .channel:hover .ch-edit { opacity: 1; }
  .ch-edit:hover { color: var(--accent); }

  /* Category filter bar */
  .cat-bar {
    display: flex;
    gap: 6px;
    padding: 8px 16px;
    overflow-x: auto;
    scrollbar-width: none;
    flex-wrap: wrap;
  }
  .cat-bar::-webkit-scrollbar { display: none; }
  .cat-pill {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-size: .7rem;
    white-space: nowrap;
    transition: all .12s;
  }
  .cat-pill:hover { border-color: var(--border-light); color: var(--text); }
  .cat-pill.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-dim);
  }

  /* Search */
  .search-wrap {
    padding: 0 16px 8px;
    display: flex;
    gap: 8px;
  }
  .search-wrap input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 12px;
    border-radius: var(--radius);
    font-size: .85rem;
    outline: none;
  }
  .search-wrap input:focus { border-color: var(--accent); }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
  .empty-state p { font-size: .9rem; margin-bottom: 16px; }

  /* ══════════════════════════════════════
     MODALS
  ══════════════════════════════════════ */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border-light);
    border-radius: 8px;
    padding: 20px;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .modal h2 {
    font-size: .9rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--accent);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .form-group { margin-bottom: 12px; }
  .form-group label {
    display: block;
    font-size: .65rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: var(--radius);
    font-size: .85rem;
    outline: none;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--accent);
  }
  .form-group textarea { resize: vertical; min-height: 50px; }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .btn {
    background: var(--panel-inner);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: .8rem;
    transition: all .12s;
  }
  .btn:hover { background: var(--border); }
  .btn-accent { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }
  .btn-accent:hover { background: #d49400; }
  .btn-danger { border-color: rgba(255,32,32,.4); color: var(--red-led); }
  .btn-danger:hover { background: rgba(255,32,32,.15); }

  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    color: var(--text-dim);
    cursor: pointer;
    transition: all .15s;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    background: var(--accent-dim);
    color: var(--text);
  }
  .drop-zone input { display: none; }
  .file-info {
    margin-top: 8px;
    font-size: .75rem;
    color: var(--green-led);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .file-info button {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--red-led);
    cursor: pointer;
    font-size: .75rem;
  }

  /* Config panel */
  .config-panel pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px;
    font-size: .7rem;
    overflow-x: auto;
    max-height: 200px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .import-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .import-row input[type=file] { flex: 1; font-size: .75rem; }

  /* Toast */
  .toast-container {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 300;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .toast {
    background: var(--panel);
    border: 1px solid var(--border-light);
    padding: 8px 14px;
    border-radius: var(--radius);
    font-size: .8rem;
    animation: slideIn .2s ease;
    max-width: 260px;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
  }
  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* Responsive */
  @media (max-width: 480px) {
    :root { --pad-size: 46vw; }
    .top-bar { padding: 8px 10px; gap: 8px; }
    .timer-display { font-size: 1.3rem; }
    .master-fader { width: 80px; }
    .logo { font-size: .9rem; }
    main { padding: 10px; }
    .channel-stripes { gap: 6px; }
  }
  @media (min-width: 481px) and (max-width: 768px) {
    :root { --pad-size: 20vw; }
  }
  @media (min-width: 1200px) {
    :root { --pad-size: 130px; }
  }
</style>
</head>
<body>

<!-- ═══ TOP BAR ═══ -->
<header class="top-bar">
  <div class="logo">
    VOICE<span>PRO</span>
  </div>

  <!-- Timer -->
  <div class="timer-section">
    <div>
      <div class="timer-label">Show Timer</div>
      <div class="timer-display" id="timerDisplay">00:00:00</div>
      <div class="timer-input-row" id="timerInputRow">
        <label>H</label><input type="number" id="timerH" min="0" max="23" value="0">
        <label>M</label><input type="number" id="timerM" min="0" max="59" value="15">
        <label>S</label><input type="number" id="timerS" min="0" max="59" value="0">
        <button class="t-btn" onclick="setCountdown()">SET</button>
      </div>
    </div>
    <div class="timer-btns">
      <button class="t-btn run" id="btnTimerStart" onclick="toggleTimer()">▶</button>
      <button class="t-btn stop" onclick="resetTimer()">↺</button>
      <button class="t-btn" onclick="toggleTimerInput()">⏱</button>
    </div>
  </div>

  <!-- Master Fader -->
  <div class="master-section">
    <div class="master-label">Master</div>
    <div class="master-fader-wrap">
      <input type="range" class="master-fader" id="masterFader" min="0" max="100" value="80" orient="vertical">
      <span class="master-val" id="masterVal">80</span>
    </div>
    <button class="master-mute" id="masterMuteBtn" onclick="toggleMasterMute()">M</button>
  </div>

  <div class="tools">
    <button class="tool-btn add" onclick="openAddModal()">+ CUE</button>
    <button class="tool-btn" onclick="openConfigModal()">⚙ CONFIG</button>
  </div>
</header>

<!-- Category Filter -->
<div class="cat-bar" id="catBar">
  <button class="cat-pill active" data-cat="all">ALL</button>
</div>

<!-- Search -->
<div class="search-wrap">
  <input type="text" id="searchInput" placeholder="Search cues...">
</div>

<!-- ═══ CHANNEL STRIPS ═══ -->
<main>
  <div class="channel-stripes" id="channelGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none">
    <div class="icon">🎛️</div>
    <p>No cues yet — add your first sound</p>
    <button class="btn btn-accent" onclick="openAddModal()">+ Add Cue</button>
  </div>
</main>

<!-- ═══ ADD / EDIT MODAL ═══ -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2 id="modalTitle">ADD CUE</h2>
    <div class="form-group">
      <label>Cue Name</label>
      <input type="text" id="soundName" placeholder="e.g. Door Slam, Enemy Roar">
    </div>
    <div class="form-group">
      <label>Category</label>
      <input type="text" id="soundCat" placeholder="e.g. Combat, Ambient, FX" list="catSuggestions">
      <datalist id="catSuggestions"></datalist>
    </div>
    <div class="form-group">
      <label>Icon</label>
      <input type="text" id="soundIcon" placeholder="🔊" maxlength="4">
    </div>
    <div class="form-group">
      <label>Keyboard Key</label>
      <input type="text" id="soundKey" placeholder="e.g. Q, 1, F1" maxlength="6">
    </div>
    <div class="form-group">
      <label>Audio File</label>
      <div class="drop-zone" id="dropZone">
        <div>📁 Drop audio here or tap to browse</div>
        <div style="font-size:.7rem;margin-top:4px;color:var(--text-dim)">MP3 · WAV · OGG · FLAC</div>
        <input type="file" id="fileInput" accept="audio/*" multiple>
      </div>
      <div id="fileList"></div>
    </div>
    <div class="form-group">
      <label>Or URL</label>
      <input type="url" id="soundUrl" placeholder="https://example.com/sound.mp3">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeAddModal()">Cancel</button>
      <button class="btn btn-accent" onclick="saveSound()">Save Cue</button>
    </div>
  </div>
</div>

<!-- ═══ CONFIG MODAL ═══ -->
<div class="modal-overlay" id="configModal">
  <div class="modal">
    <h2>CONFIGURATION</h2>
    <div class="config-panel">
      <pre id="configPreview"></pre>
    </div>
    <div class="form-group" style="margin-top:12px">
      <label>Edit JSON</label>
      <textarea id="configEdit" rows="6"></textarea>
    </div>
    <div class="import-row">
      <button class="btn btn-accent" onclick="exportConfig()">📤 Export</button>
      <button class="btn" onclick="document.getElementById('importFile').click()">📥 Import</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importConfig(event)">
      <button class="btn btn-danger" onclick="clearAll()">🗑 Clear All</button>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeConfigModal()">Close</button>
      <button class="btn btn-accent" onclick="saveConfig()">Save</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

<script>
// ═══════════════════════════════════════════════════════════
//  VOICEPRO — Theater Sound Board
// ═══════════════════════════════════════════════════════════

const STORAGE_KEY = 'voicepro_config';
const DEFAULT_CONFIG = {
  masterVolume: 80,
  masterMuted: false,
  sounds: [
    { id:'c1', name:'Ambient Wind',   cat:'Ambient', icon:'🌬️', key:'1', url:'',       vol:80, mute:false, solo:false },
    { id:'c2', name:'Fire Crackling', cat:'Ambient', icon:'🔥', key:'2', url:'',       vol:75, mute:false, solo:false },
    { id:'c3', name:'Sword Clash',    cat:'Combat',  icon:'⚔️', key:'3', url:'',       vol:90, mute:false, solo:false },
    { id:'c4', name:'Magic Cast',     cat:'Combat',  icon:'✨', key:'4', url:'',       vol:80, mute:false, solo:false },
    { id:'c5', name:'Footsteps',      cat:'Ambient', icon:'👣', key:'5', url:'',       vol:60, mute:false, solo:false },
    { id:'c6', name:'Door Open',      cat:'FX',      icon:'🚪', key:'6', url:'',       vol:70, mute:false, solo:false },
    { id:'c7', name:'Alert Bell',     cat:'FX',      icon:'🔔', key:'7', url:'',       vol:85, mute:false, solo:false },
    { id:'c8', name:'Evil Laugh',     cat:'Voice',   icon:'😈', key:'8', url:'',       vol:80, mute:false, solo:false },
    { id:'c9', name:'Wolf Growl',     cat:'Voice',   icon:'🐺', key:'9', url:'',       vol:85, mute:false, solo:false },
    { id:'c10',name:'Explosion',      cat:'Combat',  icon:'💥', key:'0', url:'',       vol:95, mute:false, solo:false },
    { id:'c11',name:'Heartbeat',      cat:'Ambient', icon:'💓', key:'Q', url:'',       vol:70, mute:false, solo:false },
    { id:'c12',name:'Thunder',        cat:'Ambient', icon:'⛈️', key:'W', url:'',       vol:90, mute:false, solo:false },
  ],
  categories: ['Combat','Ambient','FX','Voice']
};

let config = loadConfig();
let audioCache = {};
let activeAudios = [];
let currentCat = 'all';
let searchQuery = '';
let editingId = null;
let pendingFiles = [];

// ── Timer State ──
let timerMode = 'stopwatch'; // 'stopwatch' | 'countdown'
let timerSeconds = 0;
let timerRunning = false;
let timerInterval = null;
let timerCountdownFrom = 0;

// ═══════════════════════════════════════════════════
//  STORAGE
// ═══════════════════════════════════════════════════
function loadConfig() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
}
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
}

// ═══════════════════════════════════════════════════
//  AUDIO ENGINE
// ═══════════════════════════════════════════════════
function getChannelVol(id) {
  const s = config.sounds.find(x => x.id === id);
  if (!s) return 0;
  let vol = (s.vol || 80) / 100;
  if (s.mute) vol = 0;
  if (config.masterMuted) vol = 0;
  // Solo logic
  const anySolo = config.sounds.some(x => x.solo);
  if (anySolo && !s.solo) vol = 0;
  vol *= config.masterVolume / 100;
  return vol;
}

function playSound(id) {
  const s = config.sounds.find(x => x.id === id);
  if (!s || !s.url) return;
  let a = audioCache[id];
  if (!a) {
    a = new Audio(s.url);
    audioCache[id] = a;
  }
  a.volume = getChannelVol(id);
  a.currentTime = 0;
  a.play().catch(() => showToast('Tap anywhere first to enable audio'));
  if (!activeAudios.find(x => x.id === id)) {
    activeAudios.push({ id, audio: a });
    a.addEventListener('ended', () => {
      activeAudios = activeAudios.filter(x => x.id !== id);
      const el = document.getElementById(`ch-${id}`);
      if (el) el.classList.remove('playing');
    });
  }
  const el = document.getElementById(`ch-${id}`);
  if (el) el.classList.add('playing');
}

function stopAll() {
  activeAudios.forEach(({ audio }) => { audio.pause(); audio.currentTime = 0; });
  activeAudios = [];
  document.querySelectorAll('.channel.playing').forEach(p => p.classList.remove('playing'));
}

// ═══════════════════════════════════════════════════
//  TIMER
// ═══════════════════════════════════════════════════
function formatTime(totalSec) {
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function updateTimerDisplay() {
  const el = document.getElementById('timerDisplay');
  el.textContent = formatTime(timerSeconds);
  el.classList.remove('countdown', 'over');
  if (timerMode === 'countdown') {
    if (timerSeconds <= 0 && timerRunning) {
      el.classList.add('over');
      stopTimer();
      showToast('⏰ Time\'s up!');
    } else if (timerSeconds <= 10) {
      el.classList.add('countdown');
    }
  }
}

function tickTimer() {
  if (timerMode === 'countdown') {
    if (timerSeconds > 0) timerSeconds--;
    updateTimerDisplay();
  } else {
    timerSeconds++;
    updateTimerDisplay();
  }
}

function toggleTimer() {
  if (timerRunning) {
    stopTimer();
  } else {
    startTimer();
  }
}

function startTimer() {
  if (timerMode === 'countdown' && timerSeconds <= 0) return;
  timerRunning = true;
  timerInterval = setInterval(tickTimer, 1000);
  document.getElementById('btnTimerStart').textContent = '⏸';
  document.getElementById('btnTimerStart').classList.add('stop');
}

function stopTimer() {
  timerRunning = false;
  clearInterval(timerInterval);
  document.getElementById('btnTimerStart').textContent = '▶';
  document.getElementById('btnTimerStart').classList.remove('stop');
}

function resetTimer() {
  stopTimer();
  if (timerMode === 'countdown') {
    timerSeconds = timerCountdownFrom;
  } else {
    timerSeconds = 0;
  }
  updateTimerDisplay();
}

function setCountdown() {
  const h = parseInt(document.getElementById('timerH').value) || 0;
  const m = parseInt(document.getElementById('timerM').value) || 0;
  const s = parseInt(document.getElementById('timerS').value) || 0;
  timerCountdownFrom = h * 3600 + m * 60 + s;
  if (timerCountdownFrom <= 0) { showToast('Set a time first'); return; }
  timerMode = 'countdown';
  timerSeconds = timerCountdownFrom;
  updateTimerDisplay();
  showToast(`Countdown: ${formatTime(timerCountdownFrom)}`);
}

function toggleTimerInput() {
  document.getElementById('timerInputRow').classList.toggle('show');
}

// ═══════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════
function render() {
  renderCategories();
  renderChannels();
  renderCatDatalist();
  updateMasterFader();
}

function renderCategories() {
  const bar = document.getElementById('catBar');
  const cats = [...new Set(config.sounds.map(s => s.cat).filter(Boolean))].sort();
  bar.innerHTML = `<button class="cat-pill ${currentCat==='all'?'active':''}" data-cat="all">ALL</button>` +
    cats.map(c => `<button class="cat-pill ${currentCat===c?'active':''}" data-cat="${escHtml(c)}">${escHtml(c)}</button>`).join('');
  bar.querySelectorAll('.cat-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCat = btn.dataset.cat;
      renderCategories();
      renderChannels();
    });
  });
}

function renderChannels() {
  const grid = document.getElementById('channelGrid');
  const empty = document.getElementById('emptyState');
  let sounds = config.sounds;

  if (currentCat !== 'all') {
    sounds = sounds.filter(s => s.cat === currentCat);
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    sounds = sounds.filter(s => s.name.toLowerCase().includes(q) || (s.cat||'').toLowerCase().includes(q));
  }

  // Sort: keys first, then by name
  sounds.sort((a, b) => {
    const aPinned = !!(a.key && config.pinnedKeys?.includes(a.key.toUpperCase()));
    const bPinned = !!(b.key && config.pinnedKeys?.includes(b.key.toUpperCase()));
    if (aPinned && !bPinned) return -1;
    if (!aPinned && bPinned) return 1;
    return a.name.localeCompare(b.name);
  });

  if (sounds.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = sounds.map((s, i) => {
    const cueNum = String(i + 1).padStart(2, '0');
    const playing = activeAudios.find(x => x.id === s.id);
    return `
      <div class="channel ${playing ? 'playing' : ''} ${s.mute ? 'muted-ch' : ''}" id="ch-${s.id}">
        <button class="ch-delete" onclick="deleteSound('${s.id}')" title="Delete">✕</button>
        <button class="ch-edit" onclick="openEditModal('${s.id}')" title="Edit">✎</button>
        <div class="led"></div>
        <div class="pad-btn" ontouchstart="handleTouchStart(event,'${s.id}')" onclick="playSound('${s.id}')">
          <span class="pad-cue">C${cueNum}</span>
          <span class="pad-icon">${escHtml(s.icon || '🔊')}</span>
          <span class="pad-name">${escHtml(s.name)}</span>
        </div>
        <div class="ch-fader-row">
          <input type="range" class="ch-fader" min="0" max="100" value="${s.vol ?? 80}"
            oninput="setChVol('${s.id}', this.value)" orient="horizontal">
          <span class="ch-vol-label">${s.vol ?? 80}</span>
        </div>
        <div class="ch-controls">
          <button class="ch-btn mute-btn ${s.mute?'active':''}" onclick="toggleMute('${s.id}')">M</button>
          <button class="ch-btn solo-btn ${s.solo?'active':''}" onclick="toggleSolo('${s.id}')">S</button>
          <button class="ch-btn" onclick="remapKey('${s.id}')" title="Remap key">${escHtml(s.key || 'K')}</button>
        </div>
      </div>
    `;
  }).join('');
}

function renderCatDatalist() {
  const dl = document.getElementById('catSuggestions');
  const cats = [...new Set(config.sounds.map(s => s.cat).filter(Boolean))].sort();
  dl.innerHTML = cats.map(c => `<option value="${escHtml(c)}">`).join('');
}

function updateMasterFader() {
  const f = document.getElementById('masterFader');
  const v = document.getElementById('masterVal');
  const m = document.getElementById('masterMuteBtn');
  f.value = config.masterVolume;
  v.textContent = config.masterVolume;
  m.classList.toggle('muted', config.masterMuted);
}

// ═══════════════════════════════════════════════════
//  CHANNEL ACTIONS
// ═══════════════════════════════════════════════════
function setChVol(id, val) {
  const s = config.sounds.find(x => x.id === id);
  if (s) { s.vol = parseInt(val); save(); }
  // Live update volume
  const a = audioCache[id];
  if (a) a.volume = getChannelVol(id);
}

function toggleMute(id) {
  const s = config.sounds.find(x => x.id === id);
  if (s) { s.mute = !s.mute; save(); renderChannels(); }
}

function toggleSolo(id) {
  const s = config.sounds.find(x => x.id === id);
  if (s) {
    s.solo = !s.solo;
    // If enabling solo, deselect others
    if (s.solo) config.sounds.forEach(x => { if (x.id !== id) x.solo = false; });
    save();
    renderChannels();
  }
}

function toggleMasterMute() {
  config.masterMuted = !config.masterMuted;
  save();
  updateMasterFader();
  document.querySelectorAll('.channel.playing').forEach(el => {
    el.classList.toggle('muted-ch', config.masterMuted);
  });
}

function deleteSound(id) {
  if (!confirm('Delete this cue?')) return;
  config.sounds = config.sounds.filter(s => s.id !== id);
  config.categories = config.categories.filter(c => c);
  const a = activeAudios.find(x => x.id === id);
  if (a) { a.audio.pause(); a.audio.currentTime = 0; }
  activeAudios = activeAudios.filter(x => x.id !== id);
  delete audioCache[id];
  save();
  render();
  showToast('Cue deleted');
}

// ═══════════════════════════════════════════════════
//  TOUCH HANDLING (mobile prevents double-fire)
// ═══════════════════════════════════════════════════
function handleTouchStart(e, id) {
  e.preventDefault();
  // Haptic feedback
  if (navigator.vibrate) navigator.vibrate(15);
  playSound(id);
}

// ═══════════════════════════════════════════════════
//  ADD / EDIT MODAL
// ═══════════════════════════════════════════════════
function openAddModal() {
  editingId = null;
  pendingFiles = [];
  document.getElementById('modalTitle').textContent = 'ADD CUE';
  document.getElementById('soundName').value = '';
  document.getElementById('soundCat').value = '';
  document.getElementById('soundIcon').value = '';
  document.getElementById('soundKey').value = '';
  document.getElementById('soundUrl').value = '';
  document.getElementById('fileList').innerHTML = '';
  document.getElementById('addModal').classList.add('open');
}

function openEditModal(id) {
  const s = config.sounds.find(x => x.id === id);
  if (!s) return;
  editingId = id;
  pendingFiles = [];
  document.getElementById('modalTitle').textContent = 'EDIT CUE';
  document.getElementById('soundName').value = s.name || '';
  document.getElementById('soundCat').value = s.cat || '';
  document.getElementById('soundIcon').value = s.icon || '';
  document.getElementById('soundKey').value = s.key || '';
  document.getElementById('soundUrl').value = s.url || '';
  document.getElementById('fileList').innerHTML = s.url
    ? `<div class="file-info">🎵 ${escHtml(s.name)} <button onclick="clearFile()">✕</button></div>`
    : '';
  document.getElementById('addModal').classList.add('open');
}

function closeAddModal() {
  document.getElementById('addModal').classList.remove('open');
  editingId = null;
  pendingFiles = [];
}

function saveSound() {
  const name = document.getElementById('soundName').value.trim();
  const cat = document.getElementById('soundCat').value.trim();
  const icon = document.getElementById('soundIcon').value.trim() || '🔊';
  const key = document.getElementById('soundKey').value.trim().toUpperCase();
  const url = pendingFiles.length > 0 ? pendingFiles[0].url : document.getElementById('soundUrl').value.trim();

  if (!name) { showToast('Cue name required'); return; }
  if (!url) { showToast('Add an audio file or URL'); return; }

  if (editingId) {
    const s = config.sounds.find(x => x.id === editingId);
    if (s) { s.name = name; s.cat = cat; s.icon = icon; s.key = key; s.url = url; }
  } else {
    config.sounds.push({
      id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
      name, cat, icon, key, url, vol: 80, mute: false, solo: false
    });
  }
  if (cat && !config.categories.includes(cat)) config.categories.push(cat);
  save();
  closeAddModal();
  render();
  showToast(editingId ? 'Cue updated' : 'Cue added');
}

function clearFile() {
  pendingFiles = [];
  document.getElementById('fileList').innerHTML = '';
  document.getElementById('soundUrl').value = '';
}

// ── File handling ──
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => handleFiles(fileInput.files));

function handleFiles(files) {
  Array.from(files).forEach(file => {
    if (!file.type.startsWith('audio/')) return;
    const url = URL.createObjectURL(file);
    pendingFiles.push({ name: file.name, url });
  });
  renderFileList();
}

function renderFileList() {
  const container = document.getElementById('fileList');
  container.innerHTML = pendingFiles.map((f, i) =>
    `<div class="file-info">🎵 ${escHtml(f.name)} <button onclick="removePending(${i})">✕</button></div>`
  ).join('');
}

function removePending(i) {
  pendingFiles.splice(i, 1);
  renderFileList();
}

// ═══════════════════════════════════════════════════
//  CONFIG MODAL
// ═══════════════════════════════════════════════════
function openConfigModal() {
  document.getElementById('configPreview').textContent = JSON.stringify(config, null, 2);
  document.getElementById('configEdit').value = JSON.stringify(config, null, 2);
  document.getElementById('configModal').classList.add('open');
}
function closeConfigModal() { document.getElementById('configModal').classList.remove('open'); }

function saveConfig() {
  try {
    const parsed = JSON.parse(document.getElementById('configEdit').value);
    if (!parsed.sounds || !Array.isArray(parsed.sounds)) throw new Error('Need sounds array');
    // Ensure all sounds have required fields
    parsed.sounds.forEach(s => {
      s.vol = s.vol ?? 80;
      s.mute = s.mute ?? false;
      s.solo = s.solo ?? false;
    });
    config = parsed;
    save();
    audioCache = {};
    activeAudios = [];
    render();
    closeConfigModal();
    showToast('Configuration saved');
  } catch(e) {
    showToast('Invalid JSON: ' + e.message);
  }
}

function exportConfig() {
  const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `voicepro-config-${Date.now()}.json`;
  a.click();
  showToast('Config exported');
}

function importConfig(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.sounds) throw new Error('No sounds array');
      config = parsed;
      save();
      audioCache = {};
      activeAudios = [];
      render();
      closeConfigModal();
      showToast('Config imported');
    } catch(err) {
      showToast('Import failed: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function clearAll() {
  if (!confirm('Delete ALL cues? This cannot be undone.')) return;
  config.sounds = [];
  config.categories = [];
  save();
  audioCache = {};
  activeAudios = [];
  render();
  closeConfigModal();
  showToast('All cues cleared');
}

// ═══════════════════════════════════════════════════
//  KEY REMAP
// ═══════════════════════════════════════════════════
function remapKey(id) {
  const s = config.sounds.find(x => x.id === id);
  if (!s) return;
  const newKey = prompt('Enter keyboard key (e.g. R, T, F5):', s.key || '');
  if (newKey !== null) {
    s.key = newKey.trim().toUpperCase();
    save();
    renderChannels();
    showToast('Key remapped');
  }
}

// ═══════════════════════════════════════════════════
//  KEYBOARD
// ═══════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  if (e.code === 'Space') { e.preventDefault(); stopAll(); return; }
  if (e.code === 'Escape') {
    document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open'));
    return;
  }

  const key = e.key.toUpperCase();
  const sound = config.sounds.find(s => s.key === key);
  if (sound) {
    e.preventDefault();
    playSound(sound.id);
  }
});

// ═══════════════════════════════════════════════════
//  SEARCH
// ═══════════════════════════════════════════════════
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  renderChannels();
});

// ═══════════════════════════════════════════════════
//  MASTER FADER
// ═══════════════════════════════════════════════════
document.getElementById('masterFader').addEventListener('input', e => {
  config.masterVolume = parseInt(e.target.value);
  save();
  updateMasterFader();
  // Update live audios
  activeAudios.forEach(({ id, audio }) => { audio.volume = getChannelVol(id); });
});

// ═══════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════
function showToast(msg) {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ═══════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════
function escHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ═══════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════
updateMasterFader();
render();
updateTimerDisplay();
</script>
</body>
</html>
