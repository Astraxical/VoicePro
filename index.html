<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VoicePro — Sang'gre Sound Board</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg: #080a0f;
    --surface: #0d1117;
    --surface2: #161b26;
    --surface3: #1c2333;
    --border: #21262d;
    --border2: #30363d;
    --accent: #f0a500;
    --accent2: #ffb347;
    --accent-dim: rgba(240,165,0,.12);
    --green: #3fb950;
    --green-dim: rgba(63,185,80,.15);
    --red: #f85149;
    --red-dim: rgba(248,81,73,.15);
    --yellow: #d29922;
    --blue: #58a6ff;
    --purple: #bc8cff;
    --text: #e6edf3;
    --text2: #c9d1d9;
    --text3: #8b949e;
    --text4: #6e7681;
    --radius: 8px;
    --radius-sm: 5px;
    --pad-size: min(130px, 20vw);
    --transition: 150ms cubic-bezier(.4,0,.2,1);
  }

  /* Light theme */
  [data-theme="light"] {
    --bg: #f6f8fa;
    --surface: #ffffff;
    --surface2: #f0f3f6;
    --surface3: #e8ebef;
    --border: #d0d7de;
    --border2: #bcc4cc;
    --text: #1f2328;
    --text2: #388eec;
    --text3: #656d76;
    --text4: #8c959f;
    --accent-dim: rgba(240,165,0,.1);
    --green-dim: rgba(63,185,80,.1);
    --red-dim: rgba(248,81,73,.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* ══════════════════════════════════════
     HEADER
  ══════════════════════════════════════ */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 24px rgba(0,0,0,.4);
  }

  .header-inner {
    display: flex;
    align-items: center;
    gap: 16px;
    height: 56px;
    max-width: 1600px;
    margin: 0 auto;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    flex-shrink: 0;
  }
  .logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    box-shadow: 0 0 12px rgba(240,165,0,.3);
  }
  .logo-text {
    font-size: 1rem;
    font-weight: 800;
    letter-spacing: .5px;
    color: var(--text);
  }
  .logo-text span { color: var(--accent); }
  .logo-tag {
    font-size: .6rem;
    color: var(--text3);
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Timer Dock */
  .timer-section {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .timer-section::-webkit-scrollbar { display: none; }

  .timer-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 70px;
    cursor: pointer;
    transition: all var(--transition);
    position: relative;
  }
  .timer-card:hover { border-color: var(--border2); }
  .timer-card.active { border-color: var(--green); background: var(--green-dim); }
  .timer-card.over { border-color: var(--red); background: var(--red-dim); animation: pulse-red 1s infinite; }
  @keyframes pulse-red { 0%,100% { box-shadow: 0 0 0 0 rgba(248,81,73,.4); } 50% { box-shadow: 0 0 12px 2px rgba(248,81,73,.2); } }
  .timer-name { font-size: .55rem; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80px; }
  .timer-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: .75rem;
    font-weight: 600;
    color: var(--text);
  }
  .timer-display.countdown { color: var(--red); }
  .timer-display.over { color: var(--red); }
  .timer-btns { display: flex; gap: 3px; }
  .t-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text3); font-size: .6rem; padding: 1px 3px;
    border-radius: 3px; transition: all var(--transition);
  }
  .t-btn:hover { color: var(--text); background: var(--surface3); }
  .t-btn.play { color: var(--green); }
  .t-btn.reset { color: var(--blue); }
  .t-btn.del { color: var(--red); }
  .timer-edit {
    display: none;
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 10px;
    z-index: 50;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    min-width: 180px;
  }
  .timer-edit.show { display: block; }
  .timer-edit label { font-size: .55rem; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; display: block; }
  .timer-edit input[type="text"] {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 4px 8px; border-radius: var(--radius-sm);
    font-size: .75rem; outline: none; margin-bottom: 6px;
  }
  .timer-set-row { display: flex; gap: 4px; align-items: center; }
  .timer-set-row input { width: 36px; background: var(--surface2); border: 1px solid var(--border); color: var(--yellow); font-family: 'JetBrains Mono', monospace; font-size: .75rem; padding: 3px; border-radius: var(--radius-sm); text-align: center; outline: none; }
  .timer-set-row span { color: var(--text3); font-size: .7rem; }
  .timer-set-row button { margin-left: auto; background: var(--accent); border: none; color: #000; font-size: .6rem; font-weight: 700; padding: 3px 8px; border-radius: var(--radius-sm); cursor: pointer; }
  .add-timer-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text3); padding: 6px 12px; border-radius: var(--radius);
    cursor: pointer; font-size: .72rem; font-weight: 600;
    transition: all var(--transition); white-space: nowrap; flex-shrink: 0;
  }
  .add-timer-btn:hover { border-color: var(--border2); color: var(--text); }

  /* Master Section */
  .master-section {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 12px;
    flex-shrink: 0;
  }
  .master-label {
    font-size: .55rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 700;
  }
  .master-fader {
    width: 80px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .master-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: .75rem;
    color: var(--accent);
    min-width: 30px;
  }
  .master-mute {
    background: none;
    border: 1px solid var(--border);
    color: var(--text3);
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: .65rem;
    font-weight: 700;
    transition: all var(--transition);
  }
  .master-mute:hover { border-color: var(--border2); color: var(--text); }
  .master-mute.muted { background: var(--red-dim); border-color: var(--red); color: var(--red); }

  /* Tool Buttons */
  .tool-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text3);
    padding: 6px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: .72rem;
    font-weight: 600;
    transition: all var(--transition);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .tool-btn:hover { color: var(--text); border-color: var(--border2); }

  /* ══════════════════════════════════════
     NAV / FILTER BAR
  ══════════════════════════════════════ */
  .nav-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 44px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav-bar::-webkit-scrollbar { display: none; }

  .cat-pill {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text3);
    padding: 4px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: .72rem;
    font-weight: 600;
    white-space: nowrap;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .cat-pill:hover { border-color: var(--border2); color: var(--text2); }
  .cat-pill.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-dim);
  }
  .cat-pill .count {
    background: var(--border);
    color: var(--text3);
    font-size: .6rem;
    padding: 1px 5px;
    border-radius: 10px;
    font-weight: 700;
  }
  .cat-pill.active .count { background: rgba(240,165,0,.2); color: var(--accent); }

  .search-box {
    margin-left: auto;
    position: relative;
    width: 200px;
    flex-shrink: 0;
  }
  .search-box input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 10px 5px 30px;
    border-radius: 20px;
    font-size: .8rem;
    outline: none;
    transition: all var(--transition);
  }
  .search-box input:focus { border-color: var(--accent); background: var(--surface3); }
  .search-box::before {
    content: '🔍';
    position: absolute;
    left: 9px;
    top: 50%;
    transform: translateY(-50%);
    font-size: .7rem;
    pointer-events: none;
  }

  /* ══════════════════════════════════════
     MAIN CONTENT
  ══════════════════════════════════════ */
  main {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    max-width: 1600px;
    width: 100%;
    margin: 0 auto;
  }

  /* Scene sections */
  .scene-section {
    margin-bottom: 28px;
  }
  .scene-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .scene-num {
    background: var(--accent);
    color: #000;
    font-size: .65rem;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 4px;
    letter-spacing: .5px;
  }
  .scene-title {
    font-size: .85rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: .5px;
  }
  .scene-subtitle {
    font-size: .7rem;
    color: var(--text3);
    margin-left: auto;
  }

  /* Pad Grid */
  .pad-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  /* Channel Strip */
  .channel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: var(--pad-size);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 8px 8px;
    position: relative;
    transition: all var(--transition);
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    min-height: 0;
  }
  .channel:hover {
    border-color: var(--border2);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(0,0,0,.3);
  }
  .channel.playing {
    border-color: var(--green);
    box-shadow: 0 0 20px rgba(63,185,80,.2), inset 0 0 20px rgba(63,185,80,.03);
  }
  .channel.muted-ch { opacity: .35; }

  /* LED */
  .led {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--border2);
    margin-bottom: 6px;
    transition: all var(--transition);
    flex-shrink: 0;
  }
  .channel.playing .led {
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: led-pulse 1s infinite;
  }
  .channel.muted-ch .led { background: var(--red); box-shadow: 0 0 6px var(--red); }
  @keyframes led-pulse { 0%,100% { opacity: 1; } 50% { opacity: .6; } }

  /* Level Meter */
  .level-meter {
    width: 100%;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 6px;
    overflow: hidden;
    opacity: 0;
    transition: opacity var(--transition);
  }
  .channel.playing .level-meter { opacity: 1; }
  .level-meter-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--green), var(--yellow), var(--red));
    border-radius: 2px;
    transition: width 50ms linear;
  }

  /* Pad Button */
  .pad-btn {
    width: 100%;
    aspect-ratio: 1;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    background: linear-gradient(160deg, var(--surface3) 0%, var(--surface2) 100%);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    transition: all var(--transition);
    position: relative;
    overflow: hidden;
  }
  .pad-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 30%, rgba(255,255,255,.04), transparent 60%);
    pointer-events: none;
  }
  .pad-btn:active, .channel.playing .pad-btn {
    background: linear-gradient(160deg, rgba(63,185,80,.15) 0%, var(--surface2) 100%);
    border-color: var(--green);
  }
  .pad-btn .pad-icon { font-size: clamp(1.5rem, 4vw, 2.2rem); line-height: 1; }
  .pad-btn .pad-name {
    font-size: clamp(.5rem, 1.4vw, .72rem);
    font-weight: 600;
    color: var(--text2);
    text-align: center;
    line-height: 1.2;
    padding: 0 4px;
    word-break: break-word;
    max-height: 2.6em;
    overflow: hidden;
  }
  .pad-btn .pad-key {
    position: absolute;
    top: 4px; right: 5px;
    font-size: .5rem;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text4);
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 1px 4px;
    border-radius: 3px;
    z-index: 2;
    max-width: 36px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pad-btn .pad-duration {
    position: absolute;
    bottom: 4px; right: 5px;
    font-size: .45rem;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text4);
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 1px 4px;
    border-radius: 3px;
    z-index: 2;
    max-width: 40px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .channel.playing .pad-btn .pad-duration { color: var(--green); border-color: var(--green); }

  /* Loop indicator */
  .loop-indicator {
    position: absolute;
    top: 4px; left: 5px;
    font-size: .5rem;
    opacity: 0;
    transition: opacity var(--transition);
    z-index: 2;
    line-height: 1;
  }
  .channel.looping .loop-indicator { opacity: 1; }

  /* Fader */
  .ch-fader-row {
    width: 100%;
    max-width: 100%;
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 7px;
    overflow: hidden;
  }
  .ch-fader {
    flex: 1;
    height: 4px;
    accent-color: var(--accent);
    cursor: pointer;
    border-radius: 2px;
    min-width: 0;
  }
  .ch-vol-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: .55rem;
    color: var(--text4);
    min-width: 22px;
    text-align: right;
  }

  /* Control Buttons */
  .ch-controls {
    display: flex;
    gap: 3px;
    margin-top: 5px;
    width: 100%;
  }
  .ch-btn {
    flex: 1;
    padding: 4px 0;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface2);
    color: var(--text3);
    font-size: .5rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    cursor: pointer;
    transition: all var(--transition);
    text-align: center;
  }
  .ch-btn:hover { color: var(--text2); border-color: var(--border2); background: var(--surface3); }
  .ch-btn.mute-btn.active { color: var(--red); border-color: rgba(248,81,73,.4); background: var(--red-dim); }
  .ch-btn.solo-btn.active { color: var(--yellow); border-color: rgba(210,153,34,.4); background: rgba(210,153,34,.1); }
  .ch-btn.loop-btn.active { color: var(--blue); border-color: rgba(88,166,255,.4); background: rgba(88,166,255,.1); }
  .ch-btn.pan-btn.active { color: var(--purple); border-color: rgba(188,140,255,.4); background: rgba(188,140,255,.1); }

  /* Pan slider */
  .ch-pan-row {
    width: 100%;
    max-width: 100%;
    display: flex;
    align-items: center;
    gap: 3px;
    margin-top: 3px;
    overflow: hidden;
  }
  .ch-pan {
    flex: 1;
    height: 3px;
    accent-color: var(--purple);
    cursor: pointer;
    border-radius: 2px;
    min-width: 0;
  }
  .ch-pan-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: .45rem;
    color: var(--text4);
    min-width: 16px;
    text-align: center;
  }

  /* Delete / Edit */
  .ch-delete {
    position: absolute; top: 5px; left: 5px;
    background: none; border: none; color: var(--text4);
    cursor: pointer; font-size: .6rem; opacity: 0;
    transition: opacity var(--transition); padding: 2px;
    z-index: 2;
    line-height: 1;
  }
  .channel:hover .ch-delete { opacity: 1; }
  .ch-delete:hover { color: var(--red); }

  .ch-edit {
    position: absolute; top: 5px; right: 5px;
    background: none; border: none; color: var(--text4);
    cursor: pointer; font-size: .55rem; opacity: 0;
    transition: opacity var(--transition); padding: 2px;
    z-index: 2;
    line-height: 1;
  }
  .channel:hover .ch-edit { opacity: 1; }
  .ch-edit:hover { color: var(--accent); }

  /* Empty State */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text3);
  }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
  .empty-state p { font-size: .9rem; margin-bottom: 16px; }

  /* ══════════════════════════════════════
     KEY OVERLAY
  ══════════════════════════════════════ */
  .key-overlay {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,.85);
    border: 2px solid var(--accent);
    border-radius: 16px;
    padding: 20px 40px;
    z-index: 500;
    pointer-events: none;
    opacity: 0;
    transition: opacity 100ms;
    text-align: center;
  }
  .key-overlay.show { opacity: 1; }
  .key-overlay .key-char {
    font-family: 'JetBrains Mono', monospace;
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
  }
  .key-overlay .key-cue {
    font-size: .8rem;
    color: var(--text2);
    margin-top: 4px;
  }

  /* ══════════════════════════════════════
     PRESETS BAR
  ══════════════════════════════════════ */
  .presets-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 6px 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .presets-bar::-webkit-scrollbar { display: none; }
  .presets-label {
    font-size: .6rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
    white-space: nowrap;
  }
  .preset-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text3);
    padding: 3px 10px;
    border-radius: 12px;
    cursor: pointer;
    font-size: .65rem;
    font-weight: 600;
    white-space: nowrap;
    transition: all var(--transition);
  }
  .preset-btn:hover { border-color: var(--border2); color: var(--text); }
  .preset-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  /* ══════════════════════════════════════
     HISTORY BAR
  ══════════════════════════════════════ */
  .history-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 6px 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .history-bar::-webkit-scrollbar { display: none; }
  .history-label {
    font-size: .6rem;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
    white-space: nowrap;
  }
  .history-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text3);
    padding: 2px 8px;
    border-radius: 10px;
    cursor: pointer;
    font-size: .6rem;
    white-space: nowrap;
    transition: all var(--transition);
  }
  .history-item:hover { border-color: var(--border2); color: var(--text); }

  /* ══════════════════════════════════════
     MODALS
  ══════════════════════════════════════ */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(4px);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 24px 64px rgba(0,0,0,.6);
  }
  .modal h2 {
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--accent);
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block;
    font-size: .65rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text3);
    margin-bottom: 5px;
    font-weight: 600;
  }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: var(--radius);
    font-size: .85rem;
    outline: none;
    transition: border-color var(--transition);
    font-family: inherit;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--accent);
  }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 8px 16px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: .8rem;
    font-weight: 600;
    transition: all var(--transition);
  }
  .btn:hover { background: var(--surface3); border-color: var(--border2); }
  .btn-accent {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 700;
  }
  .btn-accent:hover { background: var(--accent2); border-color: var(--accent2); }
  .btn-danger { border-color: rgba(248,81,73,.4); color: var(--red); }
  .btn-danger:hover { background: var(--red-dim); }

  .drop-zone {
    border: 2px dashed var(--border2);
    border-radius: var(--radius);
    padding: 24px;
    text-align: center;
    color: var(--text3);
    cursor: pointer;
    transition: all var(--transition);
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    background: var(--accent-dim);
    color: var(--text);
  }
  .drop-zone input { display: none; }
  .file-info {
    margin-top: 8px;
    font-size: .75rem;
    color: var(--green);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .file-info button {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--red);
    cursor: pointer;
    font-size: .75rem;
  }

  .config-panel pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    font-size: .7rem;
    font-family: 'JetBrains Mono', monospace;
    overflow-x: auto;
    max-height: 200px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .import-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .import-row input[type=file] { flex: 1; font-size: .75rem; }

  /* Toast */
  .toast-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 300;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .toast {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-left: 3px solid var(--accent);
    padding: 10px 16px;
    border-radius: var(--radius);
    font-size: .8rem;
    animation: slideIn .2s ease;
    max-width: 280px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* ══════════════════════════════════════
     RESPONSIVE
  ══════════════════════════════════════ */
  @media (max-width: 640px) {
    :root { --pad-size: 44vw; }
    header { padding: 0 12px; }
    .header-inner { gap: 8px; }
    .logo-text { display: none; }
    .logo-tag { display: none; }
    .master-section { padding: 4px 8px; }
    .master-fader { width: 60px; }
    main { padding: 12px; }
    .search-box { width: 140px; }
    .scene-subtitle { display: none; }
  }
  @media (min-width: 641px) and (max-width: 1024px) {
    :root { --pad-size: 18vw; }
  }
  @media (min-width: 1025px) {
    :root { --pad-size: 140px; }
  }

  /* Print styles for cue sheet */
  @media print {
    header, .nav-bar, .presets-bar, .history-bar, .ch-delete, .ch-edit, .ch-controls, .timer-section, .add-timer-btn { display: none !important; }
    main { padding: 0; }
    .channel { break-inside: avoid; page-break-inside: avoid; }
    body { background: white; color: black; }
  }
</style>
</head>

<script>

const BASE = 'sfx/';

// ═══════════════════════════════════════════════════

    { id:'b1',  name:"MG + Explosions",    cat:'Battle', icon:'🔫', key:';',  url:BASE+'sfx_battle_01_mg.mp3',    vol:80, mute:false, solo:false, loop:true, pan:0 },

  ],

    { id:'t_show', label:'Show Runtime', type:'stopwatch', seconds:0, running:false, lastTick:0 },
    { id:'t_act2', label:'Act 2 Countdown', type:'countdown', seconds:900, running:false, lastTick:0, setSeconds:900 },
  ],
  categories: ['Thunder','Explosion','Battle','Gunfire','Magic','Music'],
  pinnedKeys: ['Q','W','E','R','T','Y','U','I','O','P','1','2','3','4','5','6','7','8','9','0'],
  history: []
};

let config = loadConfig();
let audioCache = {};
let activeAudios = [];
let currentCat = 'all';
let searchQuery = '';
let editingId = null;
let pendingFiles = [];
let editingTimerId = null;
let currentPreset = 'default';
let themeIndex = 0;
const themes = ['dark', 'light'];

// Web Audio API for level meter only
let audioCtx = null;

function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

// ═══════════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════════
function loadConfig() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
}
function save() {
  config._timerRuntime = {};
  config.timers.forEach(t => { if (t.running) config._timerRuntime[t.id] = { seconds:t.seconds, lastTick:Date.now(), type:t.type }; });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
}

// ═══════════════════════════════════════════════════
// AUDIO ENGINE (Simple & Reliable)
// ═══════════════════════════════════════════════════
function getChannelVol(id) {
  const s = config.sounds.find(x => x.id === id);
  if (!s) return 0;
  let vol = (s.vol ?? 80) / 100;
  if (s.mute) vol = 0;
  if (config.masterMuted) vol = 0;
  const anySolo = config.sounds.some(x => x.solo);
  if (anySolo && !s.solo) vol = 0;
  vol *= config.masterVolume / 100;
  return vol;
}

function playSound(id) {
  const s = config.sounds.find(x => x.id === id);
  if (!s || !s.url) return;

  // Check if currently playing this sound
  const existing = activeAudios.find(x => x.id === id);
  if (existing && !existing.audio.paused) {
    // Stop completely (pause + reset to beginning)
    existing.audio.pause();
    existing.audio.currentTime = 0;
    activeAudios = activeAudios.filter(x => x.id !== id);
    const el = document.getElementById(`ch-${id}`);
    if (el) { el.classList.remove('playing'); const meter = el.querySelector('.level-meter-fill'); if (meter) meter.style.width = '0%'; }
    return;
  }

  // Stop any other playing sounds first
  stopAll();

  let a = audioCache[id];
  if (!a) {
    a = new Audio(s.url);
    a.preload = 'auto';
    audioCache[id] = a;
  }

  // Play from beginning
  a.volume = getChannelVol(id);
  a.currentTime = 0;
  a.loop = s.loop || false;

  a.play().then(() => {
    activeAudios.push({ id, audio: a });
    const el = document.getElementById(`ch-${id}`);
    if (el) {
      el.classList.add('playing');
      startLevelMeter(id);
    }
    addToHistory(s.name, id);
    updateDurationDisplay(id, a);
  }).catch(e => {
    console.error('Play failed:', e);
    showToast('Tap page first to enable audio');
  });
}

function stopAll() {
  activeAudios.forEach(({ audio }) => {
    audio.pause();
    audio.currentTime = 0;
  });
  activeAudios = [];
  document.querySelectorAll('.channel.playing').forEach(p => {
    p.classList.remove('playing');
    const meter = p.querySelector('.level-meter-fill');
    if (meter) meter.style.width = '0%';
  });
}

function updateDurationDisplay(id, audio) {
  const el = document.getElementById(`ch-${id}`);
  if (!el) return;
  const durEl = el.querySelector('.pad-duration');
  if (!durEl) return;

  function update() {
    if (!audio.duration || isNaN(audio.duration)) return;
    const remaining = audio.duration - audio.currentTime;
    if (remaining <= 0) return;
    const m = Math.floor(remaining / 60);
    const s = Math.floor(remaining % 60);
    durEl.textContent = `${m}:${String(s).padStart(2,'0')}`;
  }

  audio.addEventListener('loadedmetadata', update);
  audio.addEventListener('timeupdate', update);
}

function startLevelMeter(id) {
  const el = document.getElementById(`ch-${id}`);
  if (!el) return;
  const meter = el.querySelector('.level-meter-fill');
  if (!meter) return;

  // Simple animated level meter (not real-time, just visual feedback)
  let frame = 0;
  function updateMeter() {
    const playing = activeAudios.find(x => x.id === id);
    if (!playing || playing.paused) {
      meter.style.width = '0%';
      return;
    }

    // Create a fake waveform animation
    frame++;
    const base = 30 + Math.sin(frame * 0.1) * 20;
    const peak = 60 + Math.sin(frame * 0.15) * 25 + Math.random() * 15;
    meter.style.width = Math.min(100, peak) + '%';

    requestAnimationFrame(updateMeter);
  }
  updateMeter();
}

function stopAll() {
  activeAudios.forEach(({ audio }) => {
    audio.pause();
    audio.currentTime = 0;
  });
  activeAudios = [];
  document.querySelectorAll('.channel.playing').forEach(p => {
    p.classList.remove('playing');
    const meter = p.querySelector('.level-meter-fill');
    if (meter) meter.style.width = '0%';
  });
}

function addToHistory(name, id) {
  // Remove duplicate
  config.history = config.history.filter(h => h.id !== id);
  // Add to front
  config.history.unshift({ name, id, time: Date.now() });
  // Keep only last 20
  config.history = config.history.slice(0, 20);
  renderHistory();
}

function renderHistory() {
  const container = document.getElementById('historyItems');
  if (!container) return;
  container.innerHTML = config.history.slice(0, 10).map(h =>
    `<button class="history-item" onclick="playSound('${h.id}')" title="${escHtml(h.name)}">${escHtml(h.name)}</button>`
  ).join('');
}

function loadPreset(name) {
  const key = `voicepro_preset_${name}`;
  const saved = localStorage.getItem(key);
  if (saved) {
    try {
      const preset = JSON.parse(saved);
      config.sounds = preset.sounds || config.sounds;
      config.timers = preset.timers || config.timers;
      config.categories = preset.categories || config.categories;
      currentPreset = name;
      renderPresetsBar();
      save();
      audioCache = {};
      activeAudios = [];
      render();
      showToast(`Loaded preset: ${name}`);
    } catch(e) { showToast('Failed to load preset'); }
  } else {
    showToast('No saved preset for this slot');
  }
}

function savePreset() {

  if (!name) { showToast('Enter a preset name'); return; }
  const key = `voicepro_preset_${name}`;

    sounds: config.sounds,
    timers: config.timers,
    categories: config.categories

  renderPresetsBar();
  showToast(`Preset "${name}" saved`);

// ═══════════════════════════════════════════════════
// TIMERS
// ═══════════════════════════════════════════════════
function formatTime(totalSec) {
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function tickAllTimers() {
  let changed = false;
  config.timers.forEach(t => {
    if (!t.running) return;
    const now = Date.now();
    const delta = Math.floor((now - t.lastTick) / 1000);
    if (delta < 1) return;
    t.lastTick = now;
    if (t.type === 'countdown') {
      t.seconds = Math.max(0, t.seconds - delta);
      if (t.seconds === 0) {
        t.running = false;
        showToast(`⏰ "${t.label}" time's up!`);
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      }
    } else {
      t.seconds += delta;
    }
    changed = true;
  });
  if (changed) renderTimers();
}

function renderTimers() {
  const dock = document.getElementById('timerDock');
  dock.innerHTML = config.timers.map(t => {
    const isActive = t.running;
    const isOver = t.type === 'countdown' && t.seconds === 0 && !t.running;
    const isCountdown = t.type === 'countdown';
    return `
      <div class="timer-card ${isActive?'active':''} ${isOver?'over':''}" data-timer-id="${escHtml(t.id)}">
        <div class="timer-edit" id="edit-${t.id}">
          <label>Label</label>
          <input type="text" id="edit-label-${t.id}" value="${escHtml(t.label)}">
          <div class="timer-set-row">
            ${isCountdown ? `
              <input type="number" id="edit-h-${t.id}" min="0" max="23" value="${Math.floor(t.setSeconds/3600)}">
              <span>:</span>
              <input type="number" id="edit-m-${t.id}" min="0" max="59" value="${Math.floor((t.setSeconds%3600)/60)}">
              <span>:</span>
              <input type="number" id="edit-s-${t.id}" min="0" max="59" value="${t.setSeconds%60}">
            ` : ''}
            <button onclick="applyTimerEdit('${t.id}')">SET</button>
          </div>
        </div>
        <div class="timer-name">${escHtml(t.label)}</div>
        <div class="timer-display ${isOver?'over':isActive && isCountdown && t.seconds<=10?'countdown':''}">
          ${formatTime(isOver ? (t.setSeconds||0) : t.seconds)}
        </div>
        <div class="timer-btns">
          <button class="t-btn ${isActive?'play':'reset'}" onclick="toggleTimer('${t.id}')">${isActive?'⏸':'▶'}</button>
          <button class="t-btn reset" onclick="resetTimer('${t.id}')">↺</button>
          <button class="t-btn del" onclick="deleteTimer('${t.id}')">✕</button>
        </div>
      </div>
    `;
  }).join('');
  config.timers.forEach(t => {
    const unit = document.querySelector(`[data-timer-id="${t.id}"]`);
    if (!unit) return;
    unit.querySelector('.timer-name').addEventListener('click', e => {
      e.stopPropagation();
      closeAllTimerEdits(t.id);
      document.getElementById(`edit-${t.id}`).classList.toggle('show');
    });
  });
}

function closeAllTimerEdits(exceptId) {
  config.timers.forEach(t => { if (t.id !== exceptId) document.getElementById(`edit-${t.id}`)?.classList.remove('show'); });
}

function toggleTimer(id) {
  const t = config.timers.find(x => x.id === id);
  if (!t) return;
  if (t.running) { t.running = false; t.lastTick = 0; }
  else {
    if (t.type === 'countdown' && t.seconds === 0) { t.seconds = t.setSeconds || 0; }
    if (t.type === 'countdown' && t.seconds === 0) return;
    t.running = true; t.lastTick = Date.now();
  }
  save(); renderTimers();
}
function resetTimer(id) {
  const t = config.timers.find(x => x.id === id);
  if (!t) return;
  t.running = false; t.lastTick = 0;
  t.seconds = t.type === 'countdown' ? (t.setSeconds || 0) : 0;
  save(); renderTimers();
}
function deleteTimer(id) {
  config.timers = config.timers.filter(t => t.id !== id);
  save(); renderTimers(); showToast('Timer removed');
}
function applyTimerEdit(id) {
  const t = config.timers.find(x => x.id === id);
  if (!t) return;
  const labelInput = document.getElementById(`edit-label-${id}`);
  if (labelInput) t.label = labelInput.value.trim() || t.label;
  if (t.type === 'countdown') {
    const h = parseInt(document.getElementById(`edit-h-${id}`)?.value) || 0;
    const m = parseInt(document.getElementById(`edit-m-${id}`)?.value) || 0;
    const s = parseInt(document.getElementById(`edit-s-${id}`)?.value) || 0;
    t.setSeconds = h*3600+m*60+s;
    t.seconds = t.setSeconds;
    if (t.seconds === 0) { showToast('Set a time > 0'); return; }
  }
  document.getElementById(`edit-${id}`)?.classList.remove('show');
  save(); renderTimers(); showToast('Timer updated');
}

function openAddTimerModal() {
  editingTimerId = null;
  document.getElementById('timerLabel').value = '';
  document.getElementById('timerType').value = 'countdown';
  document.getElementById('timerH').value = 0;
  document.getElementById('timerM').value = 15;
  document.getElementById('timerS').value = 0;
  document.getElementById('timerModal').classList.add('open');
}
function closeTimerModal() { document.getElementById('timerModal').classList.remove('open'); editingTimerId = null; }
function saveTimer() {
  const label = document.getElementById('timerLabel').value.trim() || 'Untitled';
  const type = document.getElementById('timerType').value;
  const h = parseInt(document.getElementById('timerH').value) || 0;
  const m = parseInt(document.getElementById('timerM').value) || 0;
  const s = parseInt(document.getElementById('timerS').value) || 0;
  const setSeconds = type === 'countdown' ? (h*3600+m*60+s) : 0;
  if (type === 'countdown' && setSeconds === 0) { showToast('Set a duration > 0'); return; }
  config.timers.push({
    id:'t_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
    label, type, seconds:setSeconds, running:false, lastTick:0, setSeconds
  });
  save(); closeTimerModal(); renderTimers(); showToast('Timer added');
}

// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════
function render() {
  renderTimers();
  renderCategories();
  renderChannels();
  renderCatDatalist();
  updateMasterFader();
  renderHistory();
}

function renderCategories() {
  const bar = document.getElementById('catBar');
  const cats = [...new Set(config.sounds.map(s => s.cat).filter(Boolean))].sort();
  const allCount = config.sounds.length;

  bar.innerHTML = `<button class="cat-pill ${currentCat==='all'?'active':''}" data-cat="all">
    <span>🎯 All</span><span class="count">${allCount}</span>
  </button>` +
    cats.map(c => {
      const count = config.sounds.filter(s => s.cat === c).length;
      return `<button class="cat-pill ${currentCat===c?'active':''}" data-cat="${escHtml(c)}">
        <span>${getCatIcon(c)} ${c.replace(/^Scene \d+ — /,'')}</span>
        <span class="count">${count}</span>
      </button>`;
    }).join('');

  bar.querySelectorAll('.cat-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCat = btn.dataset.cat;
      renderCategories();
      renderChannels();
    });
  });
}

function getCatIcon(cat) {
  const icons = {
    'Scene 1 — Intro':'🎬','Scene 2 — War':'⚔️','Scene 4 — Ramon':'🎩',
    'Scene 5 — Villain':'😈','Scene 6 — Ending':'🙏',
    'Thunder':'⛈️','Explosion':'💥','Battle':'🔫','Gunfire':'🎯',
    'Magic':'✨','Music':'🎵','Voice':'🎙️'
  };
  return icons[cat] || '🔊';
}

function renderChannels() {
  const main = document.getElementById('mainContent');
  const empty = document.getElementById('emptyState');

  let sounds = config.sounds;
  if (currentCat !== 'all') sounds = sounds.filter(s => s.cat === currentCat);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    sounds = sounds.filter(s => s.name.toLowerCase().includes(q) || (s.cat||'').toLowerCase().includes(q));
  }

  if (sounds.length === 0) {
    main.innerHTML = '';
    main.appendChild(empty);
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  // Group by category
  const grouped = {};
  sounds.forEach(s => {
    const key = s.cat || 'Uncategorized';
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(s);
  });

  // Sort within each group by name
  Object.values(grouped).forEach(arr => {
    arr.sort((a,b) => a.name.localeCompare(b.name));
  });

  let html = '';
  Object.entries(grouped).forEach(([cat, items]) => {
    const sceneMatch = cat.match(/Scene\s*(\d+)\s*[-—]\s*(.+)/);
    const sceneNum = sceneMatch ? sceneMatch[1] : '';
    const sceneLabel = sceneMatch ? sceneMatch[2] : cat;

    html += `
      <section class="scene-section">
        <div class="scene-header">
          ${sceneNum ? `<span class="scene-num">SCENE ${sceneNum}</span>` : ''}
          <span class="scene-title">${escHtml(sceneLabel)}</span>
          <span class="scene-subtitle">${items.length} cues</span>
        </div>
        <div class="pad-grid">
          ${items.map((s, i) => renderChannel(s, i)).join('')}
        </div>
      </section>
    `;
  });

  main.innerHTML = html;
}

function renderChannel(s, i) {
  const cueNum = String(i + 1).padStart(2, '0');
  const playing = activeAudios.find(x => x.id === s.id);
  const loopActive = s.loop ? 'loop-btn active' : 'loop-btn';
  const panValue = s.pan !== undefined ? s.pan : 0;
  return `
    <div class="channel ${playing?'playing':''} ${s.mute?'muted-ch':''} ${s.loop?'looping':''}" id="ch-${s.id}">
      <button class="ch-delete" onclick="deleteSound('${s.id}')" title="Delete">✕</button>
      <button class="ch-edit" onclick="openEditModal('${s.id}')" title="Edit">✎</button>
      <span class="loop-indicator">🔁</span>
      <div class="led"></div>
      <div class="level-meter"><div class="level-meter-fill"></div></div>
      <div class="pad-btn" ontouchstart="handleTouch(event,'${s.id}')" onclick="playSound('${s.id}')">
        <span class="pad-key">${escHtml(s.key||'')}</span>
        <span class="pad-icon">${escHtml(s.icon||'🔊')}</span>
        <span class="pad-name">${escHtml(s.name)}</span>
        <span class="pad-duration">--:--</span>
      </div>
      <div class="ch-fader-row">
        <input type="range" class="ch-fader" min="0" max="100" value="${s.vol??80}"
          oninput="setChVol('${s.id}',this.value)" orient="horizontal">
        <span class="ch-vol-label">${s.vol??80}</span>
      </div>
      <div class="ch-pan-row">
        <span class="ch-pan-label">L</span>
        <input type="range" class="ch-pan" min="-1" max="1" step="0.1" value="${panValue}"
          oninput="setChPan('${s.id}',this.value)" orient="horizontal">
        <span class="ch-pan-label">R</span>
      </div>
      <div class="ch-controls">
        <button class="ch-btn mute-btn ${s.mute?'active':''}" onclick="toggleMute('${s.id}')">M</button>
        <button class="ch-btn solo-btn ${s.solo?'active':''}" onclick="toggleSolo('${s.id}')">S</button>
        <button class="ch-btn ${loopActive}" onclick="toggleLoop('${s.id}')">L</button>
        <button class="ch-btn" onclick="remapKey('${s.id}')" title="Remap key">${escHtml(s.key||'K')}</button>
      </div>
    </div>
  `;
}

function renderCatDatalist() {
  const dl = document.getElementById('catSuggestions');
  const cats = [...new Set(config.sounds.map(s => s.cat).filter(Boolean))].sort();
  dl.innerHTML = cats.map(c => `<option value="${escHtml(c)}">`).join('');
}

function updateMasterFader() {
  document.getElementById('masterFader').value = config.masterVolume;
  document.getElementById('masterVal').textContent = config.masterVolume;
  document.getElementById('masterMuteBtn').classList.toggle('muted', config.masterMuted);
}

// ═══════════════════════════════════════════════════
// CHANNEL ACTIONS
// ═══════════════════════════════════════════════════
function setChVol(id, val) {
  const s = config.sounds.find(x => x.id === id);
  if (s) { s.vol = parseInt(val); save(); }
  const a = audioCache[id];
  if (a) a.volume = getChannelVol(id);
}

function setChPan(id, val) {
  const s = config.sounds.find(x => x.id === id);
  if (s) { s.pan = parseFloat(val); save(); }
  // Pan not supported in basic Audio API, but saved for future
}

function toggleMute(id) {
  const s = config.sounds.find(x => x.id === id);
  if (s) { s.mute = !s.mute; save(); renderChannels(); }
}

function toggleSolo(id) {
  const s = config.sounds.find(x => x.id === id);
  if (s) {
    s.solo = !s.solo;
    if (s.solo) config.sounds.forEach(x => { if (x.id !== id) x.solo = false; });
    save(); renderChannels();
  }
}

function toggleLoop(id) {
  const s = config.sounds.find(x => x.id === id);
  if (s) {
    s.loop = !s.loop;
    // If currently playing, toggle loop on the audio element
    const a = audioCache[id];
    if (a) a.loop = s.loop;
    save(); renderChannels();
    showToast(s.loop ? 'Loop ON' : 'Loop OFF');
  }
}

function toggleMasterMute() {
  config.masterMuted = !config.masterMuted;
  save(); updateMasterFader();
  document.querySelectorAll('.channel.playing').forEach(el => el.classList.toggle('muted-ch', config.masterMuted));
}

function deleteSound(id) {
  if (!confirm('Delete this cue?')) return;
  config.sounds = config.sounds.filter(s => s.id !== id);
  const a = activeAudios.find(x => x.id === id);
  if (a) { a.audio.pause(); a.audio.currentTime = 0; }
  activeAudios = activeAudios.filter(x => x.id !== id);
  delete audioCache[id];
  save(); render(); showToast('Cue deleted');
}

  e.preventDefault();
  if (navigator.vibrate) navigator.vibrate(15);
  playSound(id);
}

function openAddModal() {
  editingId = null; pendingFiles = [];
  document.getElementById('modalTitle').textContent = '➕ ADD CUE';
  ['soundName','soundCat','soundIcon','soundKey','soundUrl'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fileList').innerHTML = '';
  document.getElementById('addModal').classList.add('open');
}
function openEditModal(id) {
  const s = config.sounds.find(x => x.id === id);
  if (!s) return;
  editingId = id; pendingFiles = [];
  document.getElementById('modalTitle').textContent = '✏️ EDIT CUE';
  document.getElementById('soundName').value = s.name||'';
  document.getElementById('soundCat').value = s.cat||'';
  document.getElementById('soundIcon').value = s.icon||'';
  document.getElementById('soundKey').value = s.key||'';
  document.getElementById('soundUrl').value = s.url||'';
  document.getElementById('fileList').innerHTML = s.url
    ? `<div class="file-info">🎵 ${escHtml(s.name)} <button onclick="clearFile()">✕</button></div>` : '';
  document.getElementById('addModal').classList.add('open');
}
function closeAddModal() { document.getElementById('addModal').classList.remove('open'); editingId = null; pendingFiles = []; }
function saveSound() {
  const name = document.getElementById('soundName').value.trim();
  const cat = document.getElementById('soundCat').value.trim();
  const icon = document.getElementById('soundIcon').value.trim() || '🔊';
  const key = document.getElementById('soundKey').value.trim();
  const url = pendingFiles.length > 0 ? pendingFiles[0].url : document.getElementById('soundUrl').value.trim();
  if (!name) { showToast('Cue name required'); return; }
  if (!url) { showToast('Add an audio file or URL'); return; }
  if (editingId) {
    const s = config.sounds.find(x => x.id === editingId);
    if (s) { s.name=name; s.cat=cat; s.icon=icon; s.key=key; s.url=url; }
  } else {
    config.sounds.push({ id:'c_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), name, cat, icon, key, url, vol:80, mute:false, solo:false, loop:false, pan:0 });
  }
  if (cat && !config.categories.includes(cat)) config.categories.push(cat);
  save(); closeAddModal(); render(); showToast(editingId ? 'Cue updated' : 'Cue added');
}
function clearFile() { pendingFiles=[]; document.getElementById('fileList').innerHTML=''; document.getElementById('soundUrl').value=''; }

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', () => handleFiles(fileInput.files));
function handleFiles(files) {
  Array.from(files).forEach(file => {
    if (!file.type.startsWith('audio/')) return;
    pendingFiles.push({ name: file.name, url: URL.createObjectURL(file) });
  });
  renderFileList();
}
function renderFileList() {
  document.getElementById('fileList').innerHTML = pendingFiles.map((f,i) =>
    `<div class="file-info">🎵 ${escHtml(f.name)} <button onclick="removePending(${i})">✕</button></div>`
  ).join('');
}
function removePending(i) { pendingFiles.splice(i,1); renderFileList(); }

// ═══════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════
function openConfigModal() {
  document.getElementById('configPreview').textContent = JSON.stringify(config, null, 2);
  document.getElementById('configEdit').value = JSON.stringify(config, null, 2);
  document.getElementById('configModal').classList.add('open');
}
function closeConfigModal() { document.getElementById('configModal').classList.remove('open'); }
function saveConfig() {
  try {
    const parsed = JSON.parse(document.getElementById('configEdit').value);
    if (!parsed.sounds || !Array.isArray(parsed.sounds)) throw new Error('Need sounds array');
    parsed.sounds.forEach(s => { s.vol=s.vol??80; s.mute=s.mute??false; s.solo=s.solo??false; s.loop=s.loop??false; s.pan=s.pan??0; });
    config = parsed;
    save(); audioCache={}; activeAudios=[]; render(); closeConfigModal(); showToast('Config saved');
  } catch(e) { showToast('Invalid JSON: '+e.message); }
}
function exportConfig() {
  const blob = new Blob([JSON.stringify(config,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`voicepro-config-${Date.now()}.json`; a.click(); showToast('Config exported');
}
function importConfig(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.sounds) throw new Error('No sounds array');
      parsed.sounds.forEach(s => { s.loop=s.loop??false; s.pan=s.pan??0; });
      config = parsed; save(); audioCache={}; activeAudios=[]; render(); closeConfigModal(); showToast('Config imported');
    } catch(err) { showToast('Import failed: '+err.message); }
  };
  reader.readAsText(file); event.target.value='';
}
function clearAll() {
  if (!confirm('Delete ALL cues and timers? This cannot be undone.')) return;
  config.sounds=[]; config.timers=[]; config.categories=[]; config.history=[];
  save(); audioCache={}; activeAudios=[]; render(); closeConfigModal(); showToast('All cleared');
}

// ═══════════════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════════════
const keyOverlay = document.getElementById('keyOverlay');
let keyOverlayTimeout;

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); stopAll(); return; }
  if (e.code === 'Escape') {
    document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open'));
    closeAllTimerEdits();
    return;
  }
  const key = e.key;
  const sound = config.sounds.find(s => s.key === key);
  if (sound) {
    e.preventDefault();
    playSound(sound.id);
    // Show key overlay
    showKeyOverlay(key, sound.name);
  }
});

function showKeyOverlay(key, cueName) {
  document.getElementById('keyChar').textContent = key;
  document.getElementById('keyCue').textContent = cueName;
  keyOverlay.classList.add('show');
  clearTimeout(keyOverlayTimeout);
  keyOverlayTimeout = setTimeout(() => keyOverlay.classList.remove('show'), 800);
}

// ═══════════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════════
const searchInput = document.createElement('input');
searchInput.type = 'text';
searchInput.placeholder = 'Search...';
searchInput.id = 'searchInput';
searchInput.style.cssText = 'width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:5px 10px 5px 30px;border-radius:20px;font-size:.8rem;outline:none;transition:all var(--transition);';
document.addEventListener('DOMContentLoaded', () => {
  const navBar = document.getElementById('catBar');
  const searchBox = document.createElement('div');
  searchBox.className = 'search-box';
  searchBox.appendChild(searchInput);
  navBar.appendChild(searchBox);
});
document.getElementById('searchInput')?.addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  renderChannels();
});

// ═══════════════════════════════════════════════════
// MASTER FADER
// ═══════════════════════════════════════════════════
document.getElementById('masterFader').addEventListener('input', e => {
  config.masterVolume = parseInt(e.target.value);
  save(); updateMasterFader();
  activeAudios.forEach(({audio}) => {
    audio.volume = getChannelVol(audio.id);
  });
});

// ═══════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════
function showToast(msg) {
  const c = document.getElementById('toasts');
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  c.appendChild(t); setTimeout(() => t.remove(), 2500);
}

// ═══════════════════════════════════════════════════
// KEY REMAP
// ═══════════════════════════════════════════════════
function remapKey(id) {
  const s = config.sounds.find(x => x.id === id);
  if (!s) return;
  const newKey = prompt('Enter keyboard key:', s.key||'');
  if (newKey !== null) { s.key = newKey.trim(); save(); renderChannels(); showToast('Key remapped'); }
}

// ═══════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════
function escHtml(str) {
  const d = document.createElement('div'); d.textContent=str; return d.innerHTML;
}

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
updateMasterFader();
render();

// Resume timers from previous session
config.timers.forEach(t => {
  if (t.running && config._timerRuntime?.[t.id]) {
    const saved = config._timerRuntime[t.id];
    const elapsedSec = Math.floor((Date.now() - saved.lastTick) / 1000);
    if (saved.type === 'countdown') { t.seconds = Math.max(0, saved.seconds - elapsedSec); }
    else { t.seconds = saved.seconds + elapsedSec; }
    t.lastTick = Date.now();
  }
});

setInterval(() => { tickAllTimers(); }, 250);
setInterval(() => { save(); }, 5000);
document.addEventListener('click', e => { if (!e.target.closest('.timer-card')) closeAllTimerEdits(); });
</script>
</body>
