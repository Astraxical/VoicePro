<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VoicePro — Sang'gre Sound Board</title>
<style>
  :root {
    --bg: #0a0c10;
    --panel: #141820;
    --panel-inner: #1a1f2b;
    --border: #252d3a;
    --border-light: #333d4e;
    --accent: #f0a500;
    --accent-dim: rgba(240,165,0,.15);
    --green: #39ff14;
    --red: #ff2020;
    --yellow: #ffcc00;
    --blue: #4fc3f7;
    --text: #d0d8e8;
    --text-dim: #5a6577;
    --radius: 4px;
    --pad-size: min(120px, 20vw);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* TOP BAR */
  .top-bar {
    background: var(--panel);
    border-bottom: 2px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: stretch;
    gap: 12px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,.5);
  }
  .logo-wrap {
    display: flex;
    flex-direction: column;
    justify-content: center;
    white-space: nowrap;
  }
  .logo-title {
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 3px;
    color: var(--accent);
    text-shadow: 0 0 12px rgba(240,165,0,.4);
  }
  .logo-sub {
    font-size: .55rem;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  /* TIMER DOCK */
  .timer-dock {
    display: flex;
    gap: 6px;
    align-items: stretch;
    flex: 1;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .timer-dock::-webkit-scrollbar { display: none; }
  .timer-unit {
    background: #080a0e;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 70px;
    max-width: 130px;
    position: relative;
    cursor: pointer;
    transition: border-color .15s;
  }
  .timer-unit:hover { border-color: var(--border-light); }
  .timer-unit.active { border-color: var(--green); box-shadow: 0 0 8px rgba(57,255,20,.15); }
  .timer-unit.over { border-color: var(--red); animation: blink .5s infinite; }
  @keyframes blink { 50% { opacity: .5; } }
  .timer-label {
    font-size: .55rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .timer-display {
    font-family: 'Courier New', monospace;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--green);
    text-shadow: 0 0 8px rgba(57,255,20,.4);
    letter-spacing: 1px;
    margin: 2px 0;
  }
  .timer-display.countdown { color: var(--yellow); text-shadow: 0 0 8px rgba(255,204,0,.4); }
  .timer-display.over { color: var(--red); text-shadow: 0 0 8px rgba(255,32,32,.4); }
  .timer-ctrls {
    display: flex;
    gap: 3px;
    width: 100%;
    margin-top: 4px;
  }
  .t-btn {
    flex: 1;
    background: var(--panel-inner);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 3px 0;
    border-radius: 2px;
    cursor: pointer;
    font-size: .6rem;
    font-weight: 700;
    transition: all .1s;
    text-align: center;
  }
  .t-btn:hover { color: var(--text); border-color: var(--border-light); }
  .t-btn.run { color: var(--green); border-color: rgba(57,255,20,.3); }
  .t-btn.stop { color: var(--yellow); border-color: rgba(255,204,0,.3); }
  .t-btn.del { color: var(--red); border-color: rgba(255,32,32,.2); }
  .t-btn.del:hover { background: rgba(255,32,32,.15); }
  .timer-edit {
    display: none;
    position: absolute;
    bottom: calc(100% + 6px);
    left: 0; right: 0;
    background: var(--panel);
    border: 1px solid var(--border-light);
    border-radius: var(--radius);
    padding: 8px;
    z-index: 50;
    box-shadow: 0 -4px 16px rgba(0,0,0,.5);
  }
  .timer-edit.show { display: block; }
  .timer-edit label { font-size: .55rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); }
  .timer-edit input[type=text] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 3px 6px;
    border-radius: 2px;
    font-size: .75rem;
    margin-bottom: 6px;
    outline: none;
  }
  .timer-edit input[type=text]:focus { border-color: var(--accent); }
  .timer-set-row { display: flex; gap: 4px; align-items: center; }
  .timer-set-row input[type=number] {
    width: 36px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--yellow);
    font-family: 'Courier New', monospace;
    font-size: .8rem;
    padding: 3px;
    border-radius: 2px;
    text-align: center;
    outline: none;
  }
  .timer-set-row input[type=number]:focus { border-color: var(--accent); }
  .timer-set-row span { font-size: .6rem; color: var(--text-dim); }
  .timer-set-row button {
    background: var(--accent);
    border: none;
    color: #000;
    padding: 3px 8px;
    border-radius: 2px;
    cursor: pointer;
    font-size: .6rem;
    font-weight: 700;
    margin-left: auto;
  }

  /* MASTER SECTION */
  .master-section {
    background: var(--panel-inner);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .master-label {
    font-size: .5rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-dim);
    writing-mode: vertical-rl;
    transform: rotate(180deg);
  }
  .master-fader-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .master-fader {
    writing-mode: vertical-lr;
    direction: rtl;
    width: 100px;
    height: 8px;
    accent-color: var(--accent);
  }
  .master-val {
    font-family: 'Courier New', monospace;
    font-size: .75rem;
    color: var(--accent);
  }
  .master-mute {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 3px 8px;
    border-radius: 2px;
    cursor: pointer;
    font-size: .65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .master-mute.muted { color: var(--red); border-color: rgba(255,32,32,.4); background: rgba(255,32,32,.1); }

  .add-timer-btn {
    background: var(--panel-inner);
    border: 1px dashed var(--border-light);
    color: var(--text-dim);
    padding: 8px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: .7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all .12s;
    white-space: nowrap;
    align-self: stretch;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .add-timer-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  /* CATEGORY BAR */
  .cat-bar {
    display: flex;
    gap: 6px;
    padding: 8px 16px;
    overflow-x: auto;
    scrollbar-width: none;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .cat-bar::-webkit-scrollbar { display: none; }
  .cat-pill {
    background: var(--panel-inner);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-size: .7rem;
    white-space: nowrap;
    transition: all .12s;
  }
  .cat-pill:hover { border-color: var(--border-light); color: var(--text); }
  .cat-pill.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  .search-wrap {
    padding: 8px 16px;
    display: flex;
    gap: 8px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .search-wrap input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 12px;
    border-radius: var(--radius);
    font-size: .85rem;
    outline: none;
  }
  .search-wrap input:focus { border-color: var(--accent); }

  /* CHANNEL STRIPS */
  main {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .channel-stripes {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .channel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    width: var(--pad-size);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 8px 8px;
    position: relative;
    transition: border-color .12s, box-shadow .12s;
    user-select: none;
    -webkit-user-select: none;
  }
  .channel:hover { border-color: var(--border-light); }
  .channel.playing {
    border-color: var(--green);
    box-shadow: 0 0 15px rgba(57,255,20,.2), inset 0 0 15px rgba(57,255,20,.05);
  }
  .channel.muted-ch { opacity: .4; }

  .led {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--border-light); margin-bottom: 6px; flex-shrink: 0;
    transition: all .1s;
  }
  .channel.playing .led { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .channel.muted-ch .led { background: var(--red); box-shadow: 0 0 6px var(--red); }

  .pad-btn {
    width: 100%; aspect-ratio: 1;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    background: linear-gradient(145deg, var(--panel-inner), #0e1117);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    transition: all .08s;
    position: relative;
    overflow: hidden;
  }
  .pad-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.03), transparent 70%);
    pointer-events: none;
  }
  .pad-btn:active, .channel.playing .pad-btn {
    background: linear-gradient(145deg, #1e2a1a, #0e1117);
    border-color: var(--green);
    transform: scale(.96);
    box-shadow: inset 0 0 20px rgba(57,255,20,.1);
  }
  .pad-btn .pad-icon { font-size: clamp(1.4rem, 4vw, 2rem); line-height: 1; }
  .pad-btn .pad-name {
    font-size: clamp(.5rem, 1.5vw, .7rem);
    font-weight: 600;
    color: var(--text);
    text-align: center;
    line-height: 1.2;
    padding: 0 2px;
    word-break: break-word;
    max-height: 2.4em;
    overflow: hidden;
  }
  .pad-btn .pad-cue {
    position: absolute; top: 3px; right: 4px;
    font-size: .5rem; font-family: 'Courier New', monospace;
    color: var(--text-dim); background: var(--bg);
    padding: 1px 3px; border-radius: 2px;
  }
  .pad-btn .pad-scene {
    position: absolute; top: 3px; left: 4px;
    font-size: .45rem; font-family: monospace;
    color: var(--accent); background: rgba(240,165,0,.1);
    padding: 1px 3px; border-radius: 2px;
  }

  .ch-fader-row {
    width: 100%; display: flex; align-items: center; gap: 4px; margin-top: 6px;
  }
  .ch-fader { flex: 1; height: 4px; accent-color: var(--accent); cursor: pointer; }
  .ch-vol-label { font-size: .5rem; color: var(--text-dim); font-family: monospace; min-width: 24px; text-align: right; }

  .ch-controls { display: flex; gap: 4px; margin-top: 5px; width: 100%; }
  .ch-btn {
    flex: 1; padding: 3px 0;
    border: 1px solid var(--border); border-radius: 3px;
    background: var(--panel-inner); color: var(--text-dim);
    font-size: .55rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
    cursor: pointer; transition: all .1s; text-align: center;
  }
  .ch-btn.mute-btn.active { color: var(--red); border-color: rgba(255,32,32,.4); background: rgba(255,32,32,.1); }
  .ch-btn.solo-btn.active { color: var(--yellow); border-color: rgba(255,204,0,.4); background: rgba(255,204,0,.1); }

  .ch-delete {
    position: absolute; top: 4px; left: 4px;
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: .65rem; opacity: 0;
    transition: opacity .1s; padding: 2px;
  }
  .channel:hover .ch-delete { opacity: 1; }
  .ch-delete:hover { color: var(--red); }

  .ch-edit {
    position: absolute; top: 4px; right: 4px;
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: .6rem; opacity: 0;
    transition: opacity .1s; padding: 2px;
  }
  .channel:hover .ch-edit { opacity: 1; }
  .ch-edit:hover { color: var(--accent); }

  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--text-dim);
  }
  .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
  .empty-state p { font-size: .9rem; margin-bottom: 16px; }

  /* MODALS */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border-light);
    border-radius: 8px;
    padding: 20px;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .modal h2 {
    font-size: .85rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--accent);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .form-group { margin-bottom: 12px; }
  .form-group label {
    display: block;
    font-size: .65rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: var(--radius);
    font-size: .85rem;
    outline: none;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
  .form-group textarea { resize: vertical; min-height: 50px; }
  .modal-actions {
    display: flex; gap: 8px; justify-content: flex-end;
    margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border);
  }
  .btn {
    background: var(--panel-inner);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: .8rem;
    transition: all .12s;
  }
  .btn:hover { background: var(--border); }
  .btn-accent { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }
  .btn-accent:hover { background: #d49400; }
  .btn-danger { border-color: rgba(255,32,32,.4); color: var(--red); }
  .btn-danger:hover { background: rgba(255,32,32,.15); }

  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    color: var(--text-dim);
    cursor: pointer;
    transition: all .15s;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    background: var(--accent-dim);
    color: var(--text);
  }
  .drop-zone input { display: none; }
  .file-info {
    margin-top: 8px;
    font-size: .75rem;
    color: var(--green);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .file-info button {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--red);
    cursor: pointer;
    font-size: .75rem;
  }

  .config-panel pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px;
    font-size: .7rem;
    overflow-x: auto;
    max-height: 200px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .import-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .import-row input[type=file] { flex: 1; font-size: .75rem; }

  /* TOAST */
  .toast-container {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 300;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .toast {
    background: var(--panel);
    border: 1px solid var(--border-light);
    padding: 8px 14px;
    border-radius: var(--radius);
    font-size: .8rem;
    animation: slideIn .2s ease;
    max-width: 260px;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
  }
  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* RESPONSIVE */
  @media (max-width: 480px) {
    :root { --pad-size: 46vw; }
    .top-bar { padding: 8px 10px; gap: 8px; }
    .timer-display { font-size: 1rem; }
    .master-fader { width: 70px; }
    .logo { display: none; }
    main { padding: 10px; }
    .channel-stripes { gap: 6px; }
  }
  @media (min-width: 481px) and (max-width: 768px) {
    :root { --pad-size: 20vw; }
  }
  @media (min-width: 1200px) {
    :root { --pad-size: 130px; }
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<header class="top-bar">
  <div class="logo-wrap">
    <div class="logo-title">VOICE<span style="color:var(--text-dim)">PRO</span></div>
    <div class="logo-sub">Sang'gre Board</div>
  </div>

  <div class="timer-dock" id="timerDock"></div>

  <button class="add-timer-btn" onclick="openAddTimerModal()">+ TIMER</button>

  <div class="master-section">
    <div class="master-label">Master</div>
    <div class="master-fader-wrap">
      <input type="range" class="master-fader" id="masterFader" min="0" max="100" value="80">
      <span class="master-val" id="masterVal">80</span>
    </div>
    <button class="master-mute" id="masterMuteBtn" onclick="toggleMasterMute()">M</button>
  </div>

  <button class="tool-btn" onclick="openConfigModal()" style="background:var(--panel-inner);border:1px solid var(--border);color:var(--text-dim);padding:6px 10px;border-radius:var(--radius);cursor:pointer;font-size:.75rem;white-space:nowrap;">⚙ CONFIG</button>
</header>

<!-- CATEGORY BAR -->
<div class="cat-bar" id="catBar">
  <button class="cat-pill active" data-cat="all">ALL</button>
</div>

<!-- SEARCH -->
<div class="search-wrap">
  <input type="text" id="searchInput" placeholder="Search cues...">
</div>

<!-- MAIN CHANNEL GRID -->
<main>
  <div class="channel-stripes" id="channelGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none">
    <div class="icon">🎛️</div>
    <p>No cues yet — add your first sound</p>
    <button class="btn btn-accent" onclick="openAddModal()">+ ADD CUE</button>
  </div>
</main>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2 id="modalTitle">ADD CUE</h2>
    <div class="form-group">
      <label>Cue Name</label>
      <input type="text" id="soundName" placeholder="e.g. Cassiopeia Calls">
    </div>
    <div class="form-group">
      <label>Category</label>
      <input type="text" id="soundCat" placeholder="e.g. Scene 1, Combat" list="catSuggestions">
      <datalist id="catSuggestions"></datalist>
    </div>
    <div class="form-group">
      <label>Icon</label>
      <input type="text" id="soundIcon" placeholder="👁️" maxlength="4">
    </div>
    <div class="form-group">
      <label>Keyboard Key</label>
      <input type="text" id="soundKey" placeholder="e.g. Q, 1, F1" maxlength="6">
    </div>
    <div class="form-group">
      <label>Audio File</label>
      <div class="drop-zone" id="dropZone">
        <div>📁 Drop audio here or tap to browse</div>
        <div style="font-size:.7rem;margin-top:4px;color:var(--text-dim)">MP3 · WAV · OGG · FLAC</div>
        <input type="file" id="fileInput" accept="audio/*" multiple>
      </div>
      <div id="fileList"></div>
    </div>
    <div class="form-group">
      <label>Or URL</label>
      <input type="url" id="soundUrl" placeholder="https://example.com/sound.mp3">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeAddModal()">Cancel</button>
      <button class="btn btn-accent" onclick="saveSound()">Save Cue</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'voicepro_sanggre_v3';

const DEFAULT_CONFIG = {

    { id:'s9',  name:"CZ-52 Pistol Shot",          cat:'Scene 2', icon:'🔫', key:'9', url:'sfx/cz.mp3',              vol:80, mute:false, solo:false },

    { id:'s22', name:"Intro Audio",                cat:'Voice',   icon:'🎬', key:'F2',url:'sfx/vo_01_intro.mp3',      vol:80, mute:false, solo:false },
    { id:'s23', name:"Cassiopeia VO #1",           cat:'Voice',   icon:'🎙️', key:'F3',url:'sfx/vo_02_cassiopeia.mp3', vol:80, mute:false, solo:false },
    { id:'s24', name:"Sang'gre ng Lupa VO",         cat:'Voice',   icon:'🌍', key:'F4',url:'sfx/vo_03_lupa.mp3',       vol:80, mute:false, solo:false },
    { id:'s25', name:"Sang'gre ng Hangin VO",       cat:'Voice',   icon:'💨', key:'F5',url:'sfx/vo_04_hangin.mp3',     vol:80, mute:false, solo:false },
    { id:'s26', name:"Sang'gre ng Apoy VO",         cat:'Voice',   icon:'🔥', key:'F6',url:'sfx/vo_05_apoy.mp3',       vol:80, mute:false, solo:false },
    { id:'s27', name:"War Scene VO",               cat:'Voice',   icon:'⚔️', key:'F7',url:'sfx/vo_06_war.mp3',        vol:80, mute:false, solo:false },
    { id:'s28', name:"Magsasaka VO",               cat:'Voice',   icon:'🌾', key:'F8',url:'sfx/vo_07_magsasaka.mp3',   vol:80, mute:false, solo:false },
    { id:'s29', name:"Ramon VO",                   cat:'Voice',   icon:'📜', key:'F9',url:'sfx/vo_08_ramon.mp3',        vol:80, mute:false, solo:false },
    { id:'s30', name:"Estrada VO",                 cat:'Voice',   icon:'😈', key:'F10',url:'sfx/vo_09_estrada.mp3',    vol:80, mute:false, solo:false },
    { id:'s31', name:"Cassiopeia VO #2",           cat:'Voice',   icon:'🎙️', key:'F11',url:'sfx/vo_10_cassiopeia2.mp3',vol:80, mute:false, solo:false },
    { id:'s32', name:"Ending VO",                  cat:'Voice',   icon:'🙏', key:'F12',url:'sfx/vo_11_ending.mp3',     vol:80, mute:false, solo:false },
  ],
  timers: [
    { id:'t_show', label:'Show Runtime', type:'stopwatch', seconds:0, running:false, lastTick:0 },
    { id:'t_act2', label:'Act 2 Countdown', type:'countdown', seconds:900, running:false, lastTick:0, setSeconds:900 },
  ],
  categories: ['Scene 1','Scene 2','Scene 4','Scene 5','Scene 6','Voice'],
  pinnedKeys: ['Q','W','E','R','T','Y','U','I','O','P','1','2','3','4','5','6','7','8','9','0']
};

let config = loadConfig();
let audioCache = {};
let activeAudios = [];
let currentCat = 'all';
let searchQuery = '';
let editingId = null;
let pendingFiles = [];
let editingTimerId = null;

function loadConfig() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
}
function save() {
  config._timerRuntime = {};
  config.timers.forEach(t => { if (t.running) config._timerRuntime[t.id] = { seconds:t.seconds, lastTick:Date.now(), type:t.type }; });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
}

// ═══════════════════════════════════════════════════
// AUDIO ENGINE — FIXED: stops previous instance on re-click
// ═══════════════════════════════════════════════════
function getChannelVol(id) {
  const s = config.sounds.find(x => x.id === id);
  if (!s) return 0;
  let vol = (s.vol ?? 80) / 100;
  if (s.mute) vol = 0;
  if (config.masterMuted) vol = 0;
  const anySolo = config.sounds.some(x => x.solo);
  if (anySolo && !s.solo) vol = 0;
  vol *= config.masterVolume / 100;
  return vol;
}

function playSound(id) {
  const s = config.sounds.find(x => x.id === id);
  if (!s || !s.url) return;

  // FIX: Stop existing instance of this cue before playing again
  const existing = activeAudios.find(x => x.id === id);
  if (existing) {
    existing.audio.pause();
    existing.audio.currentTime = 0;
    activeAudios = activeAudios.filter(x => x.id !== id);
    document.getElementById(`ch-${id}`)?.classList.remove('playing');
  }

  let a = audioCache[id];
  if (!a) { a = new Audio(s.url); audioCache[id] = a; }
  a.volume = getChannelVol(id);
  a.currentTime = 0;
  a.play().catch(() => showToast('Tap anywhere first to enable audio'));

  activeAudios.push({ id, audio: a });
  const el = document.getElementById(`ch-${id}`);
  if (el) el.classList.add('playing');

  a.addEventListener('ended', () => {
    activeAudios = activeAudios.filter(x => x.id !== id);
    document.getElementById(`ch-${id}`)?.classList.remove('playing');
  });
}

function stopAll() {
  activeAudios.forEach(({ audio }) => { audio.pause(); audio.currentTime = 0; });
  activeAudios = [];
  document.querySelectorAll('.channel.playing').forEach(p => p.classList.remove('playing'));
}

// ═══════════════════════════════════════════════════
// TIMERS
// ═══════════════════════════════════════════════════
function formatTime(totalSec) {
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function tickAllTimers() {
  let changed = false;
  config.timers.forEach(t => {
    if (!t.running) return;
    const now = Date.now();
    const delta = Math.floor((now - t.lastTick) / 1000);
    if (delta < 1) return;
    t.lastTick = now;
    if (t.type === 'countdown') {
      t.seconds = Math.max(0, t.seconds - delta);
      if (t.seconds === 0) {
        t.running = false;
        showToast(`⏰ "${t.label}" time's up!`);
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      }
    } else {
      t.seconds += delta;
    }
    changed = true;
  });
  if (changed) renderTimers();
}

function renderTimers() {
  const dock = document.getElementById('timerDock');
  dock.innerHTML = config.timers.map(t => {
    const isActive = t.running;
    const isOver = t.type === 'countdown' && t.seconds === 0 && !t.running;
    const isCountdown = t.type === 'countdown';
    return `
      <div class="timer-unit ${isActive?'active':''} ${isOver?'over':''}" data-timer-id="${escHtml(t.id)}">
        <div class="timer-edit" id="edit-${t.id}">
          <label>Label</label>
          <input type="text" id="edit-label-${t.id}" value="${escHtml(t.label)}">
          <div class="timer-set-row">
            ${isCountdown ? `
              <input type="number" id="edit-h-${t.id}" min="0" max="23" value="${Math.floor(t.setSeconds/3600)}">
              <span>:</span>
              <input type="number" id="edit-m-${t.id}" min="0" max="59" value="${Math.floor((t.setSeconds%3600)/60)}">
              <span>:</span>
              <input type="number" id="edit-s-${t.id}" min="0" max="59" value="${t.setSeconds%60}">
            ` : ''}
            <button onclick="applyTimerEdit('${t.id}')">SET</button>
          </div>
        </div>
        <div class="timer-label" title="Click to edit">${escHtml(t.label)}</div>
        <div class="timer-display ${isOver?'over':isActive && isCountdown && t.seconds<=10?'countdown':''}">
          ${formatTime(isOver ? (t.setSeconds||0) : t.seconds)}
        </div>
        <div class="timer-ctrls">
          <button class="t-btn ${isActive?'stop':'run'}" onclick="toggleTimer('${t.id}')">${isActive?'⏸':'▶'}</button>
          <button class="t-btn reset" onclick="resetTimer('${t.id}')">↺</button>
          <button class="t-btn del" onclick="deleteTimer('${t.id}')">✕</button>
        </div>
      </div>
    `;
  }).join('');
  config.timers.forEach(t => {
    const unit = document.querySelector(`[data-timer-id="${t.id}"]`);
    if (!unit) return;
    unit.querySelector('.timer-label').addEventListener('click', e => {
      e.stopPropagation();
      closeAllTimerEdits(t.id);
      document.getElementById(`edit-${t.id}`).classList.toggle('show');
    });
  });
}

function closeAllTimerEdits(exceptId) {
  config.timers.forEach(t => { if (t.id !== exceptId) document.getElementById(`edit-${t.id}`)?.classList.remove('show'); });
}

function toggleTimer(id) {
  const t = config.timers.find(x => x.id === id);
  if (!t) return;
  if (t.running) { t.running = false; t.lastTick = 0; }
  else {
    if (t.type === 'countdown' && t.seconds === 0) { t.seconds = t.setSeconds || 0; }
    if (t.type === 'countdown' && t.seconds === 0) return;
    t.running = true; t.lastTick = Date.now();
  }
  save(); renderTimers();
}
function resetTimer(id) {
  const t = config.timers.find(x => x.id === id);
  if (!t) return;
  t.running = false; t.lastTick = 0;
  t.seconds = t.type === 'countdown' ? (t.setSeconds || 0) : 0;
  save(); renderTimers();
}
function deleteTimer(id) {
  config.timers = config.timers.filter(t => t.id !== id);
  save(); renderTimers(); showToast('Timer removed');
}
function applyTimerEdit(id) {
  const t = config.timers.find(x => x.id === id);
  if (!t) return;
  const labelInput = document.getElementById(`edit-label-${id}`);
  if (labelInput) t.label = labelInput.value.trim() || t.label;
  if (t.type === 'countdown') {
    const h = parseInt(document.getElementById(`edit-h-${id}`)?.value) || 0;
    const m = parseInt(document.getElementById(`edit-m-${id}`)?.value) || 0;
    const s = parseInt(document.getElementById(`edit-s-${id}`)?.value) || 0;
    t.setSeconds = h*3600+m*60+s;
    t.seconds = t.setSeconds;
    if (t.seconds === 0) { showToast('Set a time > 0'); return; }
  }
  document.getElementById(`edit-${id}`)?.classList.remove('show');
  save(); renderTimers(); showToast('Timer updated');
}

function openAddTimerModal() {
  editingTimerId = null;
  document.getElementById('timerModalTitle').textContent = 'ADD TIMER';
  document.getElementById('timerLabel').value = '';
  document.getElementById('timerType').value = 'countdown';
  document.getElementById('timerH').value = 0;
  document.getElementById('timerM').value = 15;
  document.getElementById('timerS').value = 0;
  document.getElementById('timerModal').classList.add('open');
}
function closeTimerModal() { document.getElementById('timerModal').classList.remove('open'); editingTimerId = null; }
function saveTimer() {
  const label = document.getElementById('timerLabel').value.trim() || 'Untitled';
  const type = document.getElementById('timerType').value;
  const h = parseInt(document.getElementById('timerH').value) || 0;
  const m = parseInt(document.getElementById('timerM').value) || 0;
  const s = parseInt(document.getElementById('timerS').value) || 0;
  const setSeconds = type === 'countdown' ? (h*3600+m*60+s) : 0;
  if (type === 'countdown' && setSeconds === 0) { showToast('Set a duration > 0'); return; }
  config.timers.push({
    id:'t_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
    label, type, seconds:setSeconds, running:false, lastTick:0, setSeconds
  });
  save(); closeTimerModal(); renderTimers(); showToast('Timer added');
}
document.getElementById('timerType').addEventListener('change', e => {
  document.getElementById('countdownInputs').style.display = e.target.value === 'countdown' ? 'block' : 'none';
});

// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════
function render() {
  renderTimers();
  renderCategories();
  renderChannels();
  renderCatDatalist();
  updateMasterFader();
}

function renderCategories() {
  const bar = document.getElementById('catBar');
  const cats = [...new Set(config.sounds.map(s => s.cat).filter(Boolean))].sort();
  bar.innerHTML = `<button class="cat-pill ${currentCat==='all'?'active':''}" data-cat="all">ALL</button>` +
    cats.map(c => `<button class="cat-pill ${currentCat===c?'active':''}" data-cat="${escHtml(c)}">${escHtml(c)}</button>`).join('');
  bar.querySelectorAll('.cat-pill').forEach(btn => {
    btn.addEventListener('click', () => { currentCat = btn.dataset.cat; renderCategories(); renderChannels(); });
  });
}

function renderChannels() {
  const grid = document.getElementById('channelGrid');
  const empty = document.getElementById('emptyState');
  let sounds = config.sounds;
  if (currentCat !== 'all') sounds = sounds.filter(s => s.cat === currentCat);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    sounds = sounds.filter(s => s.name.toLowerCase().includes(q) || (s.cat||'').toLowerCase().includes(q));
  }
  sounds.sort((a, b) => {
    const aP = a.key && config.pinnedKeys?.includes(a.key.toUpperCase());
    const bP = b.key && config.pinnedKeys?.includes(b.key.toUpperCase());
    if (aP && !bP) return -1;
    if (!aP && bP) return 1;
    return a.name.localeCompare(b.name);
  });

  if (sounds.length === 0) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  grid.innerHTML = sounds.map((s, i) => {
    const cueNum = String(i + 1).padStart(2, '0');
    const playing = activeAudios.find(x => x.id === s.id);
    return `
      <div class="channel ${playing?'playing':''} ${s.mute?'muted-ch':''}" id="ch-${s.id}">
        <button class="ch-delete" onclick="deleteSound('${s.id}')" title="Delete">✕</button>
        <button class="ch-edit" onclick="openEditModal('${s.id}')" title="Edit">✎</button>
        <div class="led"></div>
        <div class="pad-btn" ontouchstart="handleTouch(event,'${s.id}')" onclick="playSound('${s.id}')">
          <span class="pad-cue">C${cueNum}</span>
          <span class="pad-scene">${escHtml(s.cat||'')}</span>
          <span class="pad-icon">${escHtml(s.icon||'🔊')}</span>
          <span class="pad-name">${escHtml(s.name)}</span>
        </div>
        <div class="ch-fader-row">
          <input type="range" class="ch-fader" min="0" max="100" value="${s.vol??80}"
            oninput="setChVol('${s.id}',this.value)" orient="horizontal">
          <span class="ch-vol-label">${s.vol??80}</span>
        </div>
        <div class="ch-controls">
          <button class="ch-btn mute-btn ${s.mute?'active':''}" onclick="toggleMute('${s.id}')">M</button>
          <button class="ch-btn solo-btn ${s.solo?'active':''}" onclick="toggleSolo('${s.id}')">S</button>
          <button class="ch-btn" onclick="remapKey('${s.id}')" title="Remap key">${escHtml(s.key||'K')}</button>
        </div>
      </div>
    `;
  }).join('');
}

function renderCatDatalist() {
  const dl = document.getElementById('catSuggestions');
  const cats = [...new Set(config.sounds.map(s => s.cat).filter(Boolean))].sort();
  dl.innerHTML = cats.map(c => `<option value="${escHtml(c)}">`).join('');
}

function updateMasterFader() {
  document.getElementById('masterFader').value = config.masterVolume;
  document.getElementById('masterVal').textContent = config.masterVolume;
  document.getElementById('masterMuteBtn').classList.toggle('muted', config.masterMuted);
}

// ═══════════════════════════════════════════════════
// CHANNEL ACTIONS
// ═══════════════════════════════════════════════════
function setChVol(id, val) {
  const s = config.sounds.find(x => x.id === id);
  if (s) { s.vol = parseInt(val); save(); }
  const a = audioCache[id];
  if (a) a.volume = getChannelVol(id);
}
function toggleMute(id) {
  const s = config.sounds.find(x => x.id === id);
  if (s) { s.mute = !s.mute; save(); renderChannels(); }
}
function toggleSolo(id) {
  const s = config.sounds.find(x => x.id === id);
  if (s) {
    s.solo = !s.solo;
    if (s.solo) config.sounds.forEach(x => { if (x.id !== id) x.solo = false; });
    save(); renderChannels();
  }
}
function toggleMasterMute() {
  config.masterMuted = !config.masterMuted;
  save(); updateMasterFader();
  document.querySelectorAll('.channel.playing').forEach(el => el.classList.toggle('muted-ch', config.masterMuted));
}
function deleteSound(id) {
  if (!confirm('Delete this cue?')) return;
  config.sounds = config.sounds.filter(s => s.id !== id);
  const a = activeAudios.find(x => x.id === id);
  if (a) { a.audio.pause(); a.audio.currentTime = 0; }
  activeAudios = activeAudios.filter(x => x.id !== id);
  delete audioCache[id];
  save(); render(); showToast('Cue deleted');
}

// ═══════════════════════════════════════════════════
// TOUCH
// ═══════════════════════════════════════════════════
function handleTouch(e, id) {
  e.preventDefault();
  if (navigator.vibrate) navigator.vibrate(15);
  playSound(id);
}

// ═══════════════════════════════════════════════════
// ADD / EDIT CUE
// ═══════════════════════════════════════════════════
function openAddModal() {
  editingId = null; pendingFiles = [];
  document.getElementById('modalTitle').textContent = 'ADD CUE';
  ['soundName','soundCat','soundIcon','soundKey','soundUrl'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fileList').innerHTML = '';
  document.getElementById('addModal').classList.add('open');
}
function openEditModal(id) {
  const s = config.sounds.find(x => x.id === id);
  if (!s) return;
  editingId = id; pendingFiles = [];
  document.getElementById('modalTitle').textContent = 'EDIT CUE';
  document.getElementById('soundName').value = s.name||'';
  document.getElementById('soundCat').value = s.cat||'';
  document.getElementById('soundIcon').value = s.icon||'';
  document.getElementById('soundKey').value = s.key||'';
  document.getElementById('soundUrl').value = s.url||'';
  document.getElementById('fileList').innerHTML = s.url
    ? `<div class="file-info">🎵 ${escHtml(s.name)} <button onclick="clearFile()">✕</button></div>` : '';
  document.getElementById('addModal').classList.add('open');
}
function closeAddModal() { document.getElementById('addModal').classList.remove('open'); editingId = null; pendingFiles = []; }
function saveSound() {
  const name = document.getElementById('soundName').value.trim();
  const cat = document.getElementById('soundCat').value.trim();
  const icon = document.getElementById('soundIcon').value.trim() || '🔊';
  const key = document.getElementById('soundKey').value.trim().toUpperCase();
  const url = pendingFiles.length > 0 ? pendingFiles[0].url : document.getElementById('soundUrl').value.trim();
  if (!name) { showToast('Cue name required'); return; }
  if (!url) { showToast('Add an audio file or URL'); return; }
  if (editingId) {
    const s = config.sounds.find(x => x.id === editingId);
    if (s) { s.name=name; s.cat=cat; s.icon=icon; s.key=key; s.url=url; }
  } else {
    config.sounds.push({ id:'c_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), name, cat, icon, key, url, vol:80, mute:false, solo:false });
  }
  if (cat && !config.categories.includes(cat)) config.categories.push(cat);
  save(); closeAddModal(); render(); showToast(editingId ? 'Cue updated' : 'Cue added');
}
function clearFile() { pendingFiles=[]; document.getElementById('fileList').innerHTML=''; document.getElementById('soundUrl').value=''; }

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', () => handleFiles(fileInput.files));
function handleFiles(files) {
  Array.from(files).forEach(file => {
    if (!file.type.startsWith('audio/')) return;
    pendingFiles.push({ name: file.name, url: URL.createObjectURL(file) });
  });
  renderFileList();
}
function renderFileList() {
  document.getElementById('fileList').innerHTML = pendingFiles.map((f,i) =>
    `<div class="file-info">🎵 ${escHtml(f.name)} <button onclick="removePending(${i})">✕</button></div>`
  ).join('');
}
function removePending(i) { pendingFiles.splice(i,1); renderFileList(); }

// ═══════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════
function openConfigModal() {
  document.getElementById('configPreview').textContent = JSON.stringify(config, null, 2);
  document.getElementById('configEdit').value = JSON.stringify(config, null, 2);
  document.getElementById('configModal').classList.add('open');
}
function closeConfigModal() { document.getElementById('configModal').classList.remove('open'); }
function saveConfig() {
  try {
    const parsed = JSON.parse(document.getElementById('configEdit').value);
    if (!parsed.sounds || !Array.isArray(parsed.sounds)) throw new Error('Need sounds array');
    parsed.sounds.forEach(s => { s.vol=s.vol??80; s.mute=s.mute??false; s.solo=s.solo??false; });
    config = parsed;
    save(); audioCache={}; activeAudios=[]; render(); closeConfigModal(); showToast('Config saved');
  } catch(e) { showToast('Invalid JSON: '+e.message); }
}
function exportConfig() {
  const blob = new Blob([JSON.stringify(config,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`voicepro-config-${Date.now()}.json`; a.click(); showToast('Config exported');
}
function importConfig(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.sounds) throw new Error('No sounds array');
      config = parsed; save(); audioCache={}; activeAudios=[]; render(); closeConfigModal(); showToast('Config imported');
    } catch(err) { showToast('Import failed: '+err.message); }
  };
  reader.readAsText(file); event.target.value='';
}
function clearAll() {
  if (!confirm('Delete ALL cues and timers? This cannot be undone.')) return;
  config.sounds=[]; config.timers=[]; config.categories=[];
  save(); audioCache={}; activeAudios=[]; render(); closeConfigModal(); showToast('All cleared');
}

// ═══════════════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); stopAll(); return; }
  if (e.code === 'Escape') {
    document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open'));
    closeAllTimerEdits();
    return;
  }
  const key = e.key.toUpperCase();
  const sound = config.sounds.find(s => s.key === key);
  if (sound) { e.preventDefault(); playSound(sound.id); }
});

// ═══════════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════════
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  renderChannels();
});

// ═══════════════════════════════════════════════════
// MASTER FADER
// ═══════════════════════════════════════════════════
document.getElementById('masterFader').addEventListener('input', e => {
  config.masterVolume = parseInt(e.target.value);
  save(); updateMasterFader();
  activeAudios.forEach(({id, audio}) => { audio.volume = getChannelVol(id); });
});

// ═══════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════
function showToast(msg) {
  const c = document.getElementById('toasts');
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  c.appendChild(t); setTimeout(() => t.remove(), 2500);
}

// ═══════════════════════════════════════════════════
// KEY REMAP
// ═══════════════════════════════════════════════════
function remapKey(id) {
  const s = config.sounds.find(x => x.id === id);
  if (!s) return;
  const newKey = prompt('Enter keyboard key (e.g. R, T, F5):', s.key||'');
  if (newKey !== null) { s.key = newKey.trim().toUpperCase(); save(); renderChannels(); showToast('Key remapped'); }
}

// ═══════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════
function escHtml(str) {
  const d = document.createElement('div'); d.textContent=str; return d.innerHTML;
}

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
updateMasterFader();
render();

// Resume running timers from previous session
config.timers.forEach(t => {
  if (t.running && config._timerRuntime?.[t.id]) {
    const saved = config._timerRuntime[t.id];
    const elapsedSec = Math.floor((Date.now() - saved.lastTick) / 1000);
    if (saved.type === 'countdown') { t.seconds = Math.max(0, saved.seconds - elapsedSec); }
    else { t.seconds = saved.seconds + elapsedSec; }
    t.lastTick = Date.now();
  }
});

setInterval(() => { tickAllTimers(); }, 250);
setInterval(() => { save(); }, 5000);
document.addEventListener('click', e => { if (!e.target.closest('.timer-unit')) closeAllTimerEdits(); });
</script>
</body>
</html>
